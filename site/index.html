 protocol. No ISO 20022 message or FIBO concept stands for an authentication on its own.`}},Reversal:{is_a:`PaymentEvent`,description:`The acquirer cancelling all or part of an authorization, so the issuer releases the hold on the cardholder's funds.`,aliases:[`authorization reversal`],close_mappings:[`iso20022:cain.005.001.05`],slots:[`reversed_at`,`amount`,`currency`,`reverses`],slot_usage:{reverses:{required:!0}},annotations:{owner:`authorization`,lives_in:`warehouse`,id_rule:`rev:{reversal_id}`}},Capture:{is_a:`PaymentEvent`,description:`The merchant claiming the funds an authorization approved.`,aliases:[`clearing`,`presentment`],close_mappings:[`iso20022:cain.003.001.05`],slots:[`captured_at`,`amount`,`currency`,`conversion_rate`,`interchange_fee`,`captures`,`qualifies_for`,`in_batch`],slot_usage:{captures:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,id_rule:`cap:{capture_id}`,example:`cap:7731, Aug 4, $42.50`}},Settlement:{is_a:`PaymentEvent`,description:`Funds moving between the banks for a batch of captures.`,close_mappings:[`fibo-fbc-fi-stl:SettlementEvent`],slots:[`settled_at`,`amount`,`currency`,`settles`],slot_usage:{settles:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,id_rule:`stl:{settlement_id}`}},Adjustment:{is_a:`PaymentEvent`,description:`A correction to a capture after it cleared, such as a changed amount, made under the network's rules.`,aliases:[`clearing adjustment`,`correction`],slots:[`adjusted_at`,`amount`,`currency`,`adjusts`],slot_usage:{adjusts:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,id_rule:`adj:{adjustment_id}`,no_standard:`ISO 20022's Amendment (cain.020) reports a corrected message, not a change to a settled amount. Networks run adjustments under their own rules.`}},Payout:{is_a:`PaymentEvent`,description:`The acquirer paying a merchant for its settled captures, less fees and any amount held back in reserve.`,aliases:[`merchant funding`,`deposit`,`remittance`],slots:[`paid_at`,`amount`,`currency`,`reserve_amount`,`funds`],slot_usage:{funds:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,id_rule:`po:{payout_id}`,no_standard:`Acquirers pay merchants by ordinary bank transfer, outside the card messages, and FIBO has no merchant funding concept.`}},Refund:{is_a:`PaymentEvent`,description:`The merchant returning all or part of a captured amount.`,aliases:[`credit`],slots:[`refunded_at`,`amount`,`currency`,`refunds`],slot_usage:{refunds:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,id_rule:`rf:{refund_id}`,no_standard:`ISO 20022 sends a refund as a financial message with a refund transaction type, so no message stands for refunds alone.`}},FraudReport:{is_a:`PaymentEvent`,description:`An issuer reporting an authorization as fraud to the network.`,aliases:[`TC40`,`SAFE report`],close_mappings:[`iso20022:cafr.001.001.04`],slots:[`reported_at`,`reports`],slot_usage:{reports:{required:!0}},annotations:{owner:`risk`,lives_in:`graph`,id_rule:`fr:{report_id}`}},DisputeEvent:{is_a:`PaymentEvent`,abstract:!0,description:`A step in a dispute over a captured transaction. Each step carries the amount in dispute and, while it waits for an answer, the date the other side must respond by.`,slots:[`opened_at`,`respond_by`,`amount`,`currency`,`disputes`,`has_reason`,`responds_to`],annotations:{owner:`disputes`,lives_in:`graph`}},RetrievalRequest:{is_a:`DisputeEvent`,description:`The issuer asking the acquirer for the original transaction details, often before it decides whether to dispute.`,aliases:[`copy request`,`request for copy`],close_mappings:[`iso20022:cain.021.001.04`],slot_usage:{disputes:{required:!0}},annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`rr:{retrieval_id}`}},Chargeback:{is_a:`DisputeEvent`,title:`Chargeback`,aliases:[`CB`,`chargeback case`],close_mappings:[`iso20022:cain.027.001.04`],description:`A dispute event in which the issuer, through the card network, reverses all or part of a captured transaction for the cardholder.`,slot_usage:{disputes:{required:!0},has_reason:{required:!0},opened_at:{required:!0},amount:{required:!0},currency:{required:!0}},annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`cb:{chargeback_id}`,example:`cb:1001, Aug 19, reason 10.4, $42.50`}},Representment:{is_a:`DisputeEvent`,description:`The merchant's response to a chargeback, with its evidence.`,aliases:[`second presentment`,`merchant response`],slots:[`has_evidence`],slot_usage:{responds_to:{required:!0}},annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`rep:{representment_id}`,no_standard:`ISO 20022's chargeback response (cain.028) answers a chargeback, but whether it carries the merchant's evidence isn't confirmed yet.`}},PreArbitration:{is_a:`DisputeEvent`,description:`Issuer challenges the merchant's response before arbitration.`,aliases:[`pre-arb`],slot_usage:{responds_to:{required:!0}},annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`parb:{pre_arbitration_id}`,no_standard:`Pre-arbitration is a card network rule, with no ISO 20022 message or FIBO concept of its own.`}},Arbitration:{is_a:`DisputeEvent`,description:`Either side asking the card network to decide a dispute that pre-arbitration didn't settle. The network's ruling is binding.`,aliases:[`arbitration case`],slot_usage:{responds_to:{required:!0}},annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`arb:{arbitration_id}`,no_standard:`Arbitration is a card network rule, with no ISO 20022 message or FIBO concept of its own.`}},DisputeOutcome:{is_a:`DisputeEvent`,description:`The event that closes a dispute: which side won, how it ended, and the amount that finally went back to the cardholder. It answers the dispute's last step, and links to the disputed capture, as the chargeback does.`,aliases:[`dispute resolution`,`case closure`],slots:[`won_by`,`closure`],slot_usage:{disputes:{required:!0},responds_to:{required:!0},won_by:{required:!0},closure:{required:!0}},annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`out:{outcome_id}`,no_standard:`The ISO 20022 card messages carry the steps of a dispute, but none stands for its outcome. Networks record it in their own case systems.`}},ClearingBatch:{description:`A batch of captures sent for clearing and settlement in one exchange, such as an acquirer's clearing file.`,aliases:[`clearing file`,`settlement file`,`batch`],close_mappings:[`iso20022:caad.003.001.04`],slots:[`id`,`sent_at`],annotations:{owner:`settlement`,lives_in:`warehouse`,graph_load:`never`,id_rule:`batch:{batch_id}`}},Reconciliation:{description:`A member checking its totals for a settlement against the network's, and recording any difference.`,aliases:[`recon`,`settlement reconciliation`],close_mappings:[`iso20022:caad.005.001.05`],slots:[`id`,`reconciled_at`,`matched`,`difference`,`currency`,`reconciles`],slot_usage:{reconciles:{required:!0},matched:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,graph_load:`never`,id_rule:`rec:{reconciliation_id}`}},FeeCollection:{description:`The network collecting fees from a member, an issuer or an acquirer, such as its monthly assessments.`,aliases:[`network fees`,`assessments`,`network billing`],close_mappings:[`iso20022:cafc.001.001.04`],slots:[`id`,`collected_at`,`amount`,`currency`,`collected_from`,`under`],slot_usage:{collected_from:{required:!0}},annotations:{owner:`settlement`,lives_in:`warehouse`,graph_load:`never`,id_rule:`fc:{collection_id}`}},FeeProgram:{description:`A fee a network publishes, such as an interchange category a capture qualifies for. A node, so captures and the fees charged meet at one place; the amounts stay in Snowflake (decision 2).`,aliases:[`interchange category`,`interchange program`,`fee schedule`],slots:[`id`,`network`,`code`,`name`,`fee_type`],annotations:{owner:`settlement`,lives_in:`graph`,id_rule:`fee:{network}:{code}`,no_standard:`Each network publishes its own interchange programs and fees; no ISO list or FIBO concept covers them.`}},ReasonCode:{description:`A network's reason for a dispute. A node, so chargebacks and the documents that explain the code meet at one place.`,aliases:[`dispute reason`],slots:[`id`,`network`,`code`],annotations:{owner:`disputes`,lives_in:`graph`,id_rule:`rc:{network}:{code}`,no_standard:`Each card network publishes its own dispute reason codes; no ISO list covers them.`,example:`rc:visa:10.4, Other Fraud: Card-Absent Environment`,code_list:`VisaReasonCode`}},ResponseCode:{description:`The issuer's answer code on an authorization, such as approved or declined.`,slots:[`id`,`code`],annotations:{owner:`authorization`,lives_in:`graph`,id_rule:`resp:{code}`,no_standard:`Response codes come from ISO 8583 and each network's rules, which publish no identifiers to map to.`}},Document:{description:`A network rule book, runbook or piece of evidence. Its text lives in search; Neptune keeps a stub.`,close_mappings:[`cmns-doc:Document`],slots:[`id`,`name`,`kind`],annotations:{owner:`core`,lives_in:`search`,id_rule:`{doc_slug}`,example:`visa-vamp-2026`}},Chunk:{description:`A passage of a document. Its text and embedding live in OpenSearch; the stub in Neptune links it to the entities it mentions.`,slots:[`id`,`part_of`,`mentions`],annotations:{owner:`core`,lives_in:`search`,id_rule:`{doc_slug}#{chunk}`,search_index:`chunks`,no_standard:`A passage of an indexed document is this platform's own idea.`,example:`visa-vamp-2026#c04`}},Any:{class_uri:`linkml:Any`,description:`Any entity with an ID. A relationship whose range is Any can point at a node of any class, as a chunk's MENTIONS does. Not a node itself.`}},slots:{id:{identifier:!0,description:`The one ID used in Neptune, OpenSearch and Snowflake.`},name:{description:`What people call it.`},mcc:{description:`Merchant category code, from ISO 18245.`,pattern:`^\\d{4}$`,close_mappings:[`fibo-be-fct-fct:MerchantCategoryCode`]},network:{description:`The card network whose rules apply.`,range:`CardNetwork`},code:{description:`The code as the network or issuer writes it.`},prefix:{description:`The leading digits every card in the range shares.`},kind:{description:`What sort of document it is.`,range:`DocumentKind`},amount:{description:`The amount, in the transaction currency.`,range:`decimal`},currency:{description:`The transaction currency, as an ISO 4217 alphabetic code such as USD.`,pattern:`^[A-Z]{3}$`},channel:{description:`Whether the card was present.`,range:`Channel`},approved_amount:{description:`The amount the issuer approved, when less than the amount requested: a partial approval.`,range:`decimal`},authorization_type:{description:`Whether an authorization's amount is final, an estimate, or an increase to an earlier estimate.`,range:`AuthorizationType`},initiated_by:{description:`Who started the payment, under the networks' stored-credential rules: the cardholder, or the merchant using a card it keeps on file.`,range:`Initiator`},standing_instruction:{description:`The agreement a merchant-initiated payment follows, such as a subscription.`,range:`StandingInstruction`},decided_by:{description:`Who answered the authorization: the issuer, or stand-in processing answering for an issuer that couldn't.`,range:`Decider`},credential:{description:`What stood in for the card number in an authorization.`,range:`Credential`},token_requestor:{description:`The Token Requestor ID of the wallet or merchant a network token was issued to: 11 digits, assigned under EMVCo's payment tokenisation.`,pattern:`^\\d{11}$`},funding_source:{description:`Where the money behind the cards in a BIN range comes from, as the network's BIN table reports it.`,range:`FundingSource`},country:{description:`A country, as an ISO 3166-1 alpha-2 code such as US: where a merchant trades, or where a BIN range is licensed.`,pattern:`^[A-Z]{2}$`},authentication_result:{description:`How an authentication ended, as EMV 3-D Secure's final transaction status reports it.`,range:`AuthenticationResult`},challenged:{description:`Whether the issuer challenged the cardholder, such as with a one-time code, rather than letting the payment through without friction.`,range:`boolean`},authorized_at:{description:`When the issuer answered.`,range:`datetime`},captured_at:{description:`When the merchant claimed the funds.`,range:`datetime`},settled_at:{description:`When the funds moved.`,range:`datetime`},refunded_at:{description:`When the refund was made.`,range:`datetime`},adjusted_at:{description:`When the adjustment was made.`,range:`datetime`},paid_at:{description:`When the acquirer paid the merchant.`,range:`datetime`},sent_at:{description:`When the batch was sent.`,range:`datetime`},reconciled_at:{description:`When the totals were checked.`,range:`datetime`},collected_at:{description:`When the network collected the fees.`,range:`datetime`},conversion_rate:{description:`The rate that converted a capture's amount into its settlement's currency, when the two differ.`,range:`decimal`},interchange_fee:{description:`The interchange the capture paid, in its settlement's currency. The amount stays in Snowflake; the program it qualified for is a node.`,range:`decimal`},reserve_amount:{description:`The amount held back from a payout into the merchant's reserve; negative when the acquirer releases reserve.`,range:`decimal`},matched:{description:`Whether the member's totals matched the network's.`,range:`boolean`},difference:{description:`The amount by which the totals differed.`,range:`decimal`},fee_type:{description:`What kind of fee a program sets.`,range:`FeeType`},reversed_at:{description:`When the acquirer sent the reversal.`,range:`datetime`},authenticated_at:{description:`When the cardholder was authenticated.`,range:`datetime`},reported_at:{description:`When the fraud was reported.`,range:`datetime`},opened_at:{description:`When the dispute step began.`,range:`datetime`},respond_by:{description:`When the other side must answer this step by, under the network's rules for the stage. Missing it decides the dispute against that side.`,range:`datetime`},won_by:{description:`The side a dispute ended in favor of.`,range:`DisputeSide`},closure:{description:`How a dispute ended.`,range:`DisputeClosure`},acts_as:{description:`A party plays a role.`,range:`PartyRole`,multivalued:!0},acquired_by:{description:`A merchant's acquiring bank.`,range:`Acquirer`},held_by:{description:`Who a card is issued to.`,range:`Cardholder`},in_bin_range:{description:`The BIN range a card's number falls in.`,range:`BinRange`},assigned_to:{description:`The issuer a BIN range belongs to.`,range:`Issuer`},at_merchant:{description:`Where an authorization was requested.`,range:`Merchant`},with_card:{description:`The card an authorization used.`,range:`Card`},from_device:{description:`The device an authorization came from.`,range:`Device`},seen_at:{description:`A summary edge, rebuilt daily from Snowflake: the device made authorizations at the merchant. It carries auths, first_seen and last_seen, so risk walks don't need every authorization in the graph (decision 2).`,range:`Merchant`,multivalued:!0,annotations:{edge_properties:`auths:Long, first_seen:DateTime, last_seen:DateTime`}},has_response:{description:`The issuer's answer to an authorization.`,range:`ResponseCode`},authenticated_by:{description:`The authentication an authorization relied on.`,range:`Authentication`},increments:{description:`The earlier authorization an incremental authorization adds to.`,range:`Authorization`},reverses:{description:`The authorization a reversal cancels.`,range:`Authorization`},captures:{description:`The authorization a capture claims funds for.`,range:`Authorization`},settles:{description:`The captures a settlement pays out.`,range:`Capture`,multivalued:!0},refunds:{description:`The capture a refund returns money from.`,range:`Capture`},adjusts:{description:`The capture an adjustment corrects.`,range:`Capture`},funds:{description:`The captures a payout pays the merchant for.`,range:`Capture`,multivalued:!0},qualifies_for:{description:`The interchange program a capture qualified for.`,range:`FeeProgram`},in_batch:{description:`The batch that carried a capture to the network.`,range:`ClearingBatch`},reconciles:{description:`The settlement whose totals were checked.`,range:`Settlement`},collected_from:{description:`The member the fees were collected from, an issuer or an acquirer.`,range:`PartyRole`},under:{description:`The fee program a collection charges.`,range:`FeeProgram`},disputes:{description:`Links a dispute event to the capture it contests.`,range:`Capture`},has_reason:{description:`The network reason codes behind a dispute.`,range:`ReasonCode`,multivalued:!0},responds_to:{description:`The earlier dispute event this one answers.`,range:`DisputeEvent`},has_evidence:{description:`Documents sent as evidence.`,range:`Document`,multivalued:!0},reports:{description:`The authorization a fraud report is about.`,range:`Authorization`},part_of:{description:`The document a chunk comes from.`,range:`Document`},mentions:{description:`Anything a chunk names, such as a merchant, a reason code or a dispute, so its text links to the graph.`,range:`Any`,multivalued:!0}},enums:{CardNetwork:{description:`Card networks whose rules the ontology covers.`,close_mappings:[`fibo-loan-spc-crd:CreditCardNetwork`],permissible_values:{visa:{meaning:`fibo-loan-spc-crd:VisaNetwork`},mastercard:{meaning:`fibo-loan-spc-crd:MastercardNetwork`}}},Channel:{description:`How the card took part in a payment.`,permissible_values:{card_present:null,card_not_present:null}},AuthorizationType:{description:`What an authorization's amount means. Visa names estimated and incremental authorizations; Mastercard names preauthorizations, undefined and final authorizations.`,permissible_values:{final:{description:`The amount is final, and the payment will be captured for it.`},estimated:{description:`The final amount isn't known yet, such as at a hotel or car rental. Mastercard calls it a preauthorization.`},incremental:{description:`An increase to an earlier estimated authorization.`},undefined:{description:`Neither final nor an estimate, in Mastercard's terms.`}}},Initiator:{description:`Who started a payment, under the networks' stored-credential rules.`,permissible_values:{cardholder:{description:`The cardholder took part, such as at a checkout.`},merchant:{description:`The merchant charged a card it keeps on file, under an agreement with the cardholder.`}}},StandingInstruction:{description:`The agreement a merchant-initiated payment follows.`,permissible_values:{recurring:{description:`Regular charges, such as a subscription.`},installment:{description:`A set number of payments for one purchase.`},unscheduled:{description:`Charges at no fixed time, such as a top-up when a balance runs low.`}}},Decider:{description:`Who answered an authorization.`,permissible_values:{issuer:{description:`The issuer, or its processor, decided.`},network_stand_in:{description:`The network's stand-in processing answered for the issuer, such as Visa's STIP.`},processor_stand_in:{description:`The issuer's processor answered with its own stand-in rules.`}}},FeeType:{description:`What kind of fee a program sets.`,permissible_values:{interchange:{description:`Paid by the acquirer to the issuer on each capture.`},network_fee:{description:`Charged by the network to its members, such as assessments.`}}},Credential:{description:`What stood in for the card number in an authorization.`,permissible_values:{pan:{description:`The card number itself.`},card_on_file_token:{description:`A network token a merchant or processor keeps on file.`},wallet_token:{description:`A network token held in a digital wallet, such as a phone's.`}}},FundingSource:{description:`Where the money behind a card comes from, as networks' BIN tables report it.`,permissible_values:{credit:{description:`A line of credit.`,close_mappings:[`fibo-loan-spc-crd:CreditCard`]},debit:{description:`A deposit account.`,close_mappings:[`fibo-loan-spc-crd:DebitCard`]},prepaid:{description:`Funds loaded onto the card in advance.`}}},AuthenticationResult:{description:`How a cardholder authentication ended, following EMV 3-D Secure's final transaction status.`,permissible_values:{authenticated:{description:`The cardholder was verified (status Y).`},attempted:{description:`Not verified, but proof of an attempt is provided (status A).`},not_authenticated:{description:`Not verified, and the transaction is denied (status N).`},rejected:{description:`The issuer rejected it and asks that no authorization be attempted (status R).`},unavailable:{description:`It couldn't be performed, for a technical or other reason (status U).`}}},DisputeSide:{description:`The two sides of a card dispute. Each bank stands in for its customer.`,permissible_values:{issuer:{description:`The issuer, for its cardholder.`},acquirer:{description:`The acquirer, for its merchant.`}}},DisputeClosure:{description:`How a dispute ended.`,permissible_values:{accepted:{description:`One side accepted the other's last step.`},withdrawn:{description:`The issuer withdrew the dispute, often because its cardholder did.`},ruled:{description:`The card network ruled in arbitration.`},timed_out:{description:`A side missed its deadline, so the dispute went against it.`}}},DocumentKind:{description:`Kinds of document the platform indexes.`,permissible_values:{network_rules:null,runbook:null,evidence:null}},VisaReasonCode:{description:`Visa dispute reason codes. Each is loaded as a ReasonCode node.`,permissible_values:{"10.4":{description:`Other Fraud: Card-Absent Environment`,meaning:`pay:visa-10.4`},"13.1":{description:`Merchandise/Services Not Received`,meaning:`pay:visa-13.1`}}}}},Qd={questions:[{id:`CQ-01`,domain:`disputes`,question:`Which merchants had the most 10.4 chargebacks last month?`,walks:[`Chargeback.has_reason`,`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:HAS_REASON]->(:ReasonCode {id: $reason})
MATCH (cb)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(a:Authorization)
MATCH (a)-[:AT_MERCHANT]->(m:Merchant)
WHERE cb.opened_at >= $month_start AND cb.opened_at < $month_end
RETURN m.id AS merchant, m.name AS name, count(DISTINCT cb) AS chargebacks
ORDER BY chargebacks DESC
LIMIT 10
`},{id:`CQ-02`,domain:`disputes`,question:`What evidence did we send for this chargeback, and when?`,walks:[`Representment.responds_to`,`Representment.has_evidence`],answered_in:`neptune`,query:`MATCH (cb:Chargeback {id: $chargeback})<-[:RESPONDS_TO]-(rep:Representment)
OPTIONAL MATCH (rep)-[:HAS_EVIDENCE]->(doc:Document)
RETURN rep.id AS response, rep.opened_at AS sent_at, collect(doc.id) AS evidence
ORDER BY sent_at
LIMIT 20
`},{id:`CQ-07`,domain:`disputes`,question:`Which chargebacks against this merchant still have no representment?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`,`Representment.responds_to`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(:Authorization)-[:AT_MERCHANT]->(:Merchant {id: $merchant})
WHERE NOT (cb)<-[:RESPONDS_TO]-(:Representment)
RETURN cb.id AS chargeback, cb.opened_at AS opened_at
ORDER BY opened_at
LIMIT 100
`},{id:`CQ-08`,domain:`disputes`,question:`Show this chargeback's whole dispute chain, from chargeback to pre-arbitration.`,walks:[`Representment.responds_to`,`PreArbitration.responds_to`],answered_in:`neptune`,query:`MATCH (cb:Chargeback {id: $chargeback})
OPTIONAL MATCH (rep:Representment)-[:RESPONDS_TO]->(cb)
OPTIONAL MATCH (pa:PreArbitration)-[:RESPONDS_TO]->(rep)
RETURN cb.id AS chargeback, cb.opened_at AS opened_at, rep.id AS representment,
       rep.opened_at AS represented_at, pa.id AS pre_arbitration, pa.opened_at AS challenged_at
LIMIT 10
`},{id:`CQ-09`,domain:`disputes`,question:`Which reason codes did this merchant's chargebacks cite in the last 90 days?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`,`Chargeback.has_reason`],answered_in:`neptune`,query:`MATCH (:Merchant {id: $merchant})<-[:AT_MERCHANT]-(:Authorization)<-[:CAPTURES]-(:Capture)<-[:DISPUTES]-(cb:Chargeback)
MATCH (cb)-[:HAS_REASON]->(rc:ReasonCode)
WHERE cb.opened_at >= $since
RETURN rc.id AS reason, count(DISTINCT cb) AS chargebacks
ORDER BY chargebacks DESC
LIMIT 20
`},{id:`CQ-10`,domain:`disputes`,question:`Which chargebacks were opened on a transaction we had already refunded?`,walks:[`Chargeback.disputes`,`Refund.refunds`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(cap:Capture)<-[:REFUNDS]-(rf:Refund)
WHERE rf.refunded_at < cb.opened_at
RETURN cb.id AS chargeback, cap.id AS capture, rf.id AS refund, rf.refunded_at AS refunded_at
LIMIT 100
`},{id:`CQ-11`,domain:`disputes`,question:`Which network rule passages explain reason code 10.4?`,walks:[`Chunk.mentions`,`Chunk.part_of`],answered_in:`neptune`,query:`MATCH (k:Chunk)-[:MENTIONS]->(:ReasonCode {id: $reason})
MATCH (k)-[:PART_OF]->(doc:Document)
WHERE doc.kind = 'network_rules'
RETURN doc.id AS document, k.id AS passage
LIMIT 20
`},{id:`CQ-12`,domain:`disputes`,question:`Which documents have we sent as evidence against reason code 13.1, and how often?`,walks:[`Representment.responds_to`,`Chargeback.has_reason`,`Representment.has_evidence`],answered_in:`neptune`,query:`MATCH (rep:Representment)-[:RESPONDS_TO]->(cb:Chargeback)-[:HAS_REASON]->(:ReasonCode {id: $reason})
MATCH (rep)-[:HAS_EVIDENCE]->(doc:Document)
RETURN doc.id AS document, doc.kind AS kind, count(DISTINCT rep) AS representments
ORDER BY representments DESC
LIMIT 20
`},{id:`CQ-13`,domain:`disputes`,question:`Which merchants had pre-arbitration challenges this quarter?`,walks:[`PreArbitration.responds_to`,`Representment.responds_to`,`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (pa:PreArbitration)-[:RESPONDS_TO]->(:Representment)-[:RESPONDS_TO]->(cb:Chargeback)
MATCH (cb)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(:Authorization)-[:AT_MERCHANT]->(m:Merchant)
WHERE pa.opened_at >= $quarter_start
RETURN m.id AS merchant, m.name AS name, count(DISTINCT pa) AS pre_arbitrations
ORDER BY pre_arbitrations DESC
LIMIT 20
`},{id:`CQ-14`,domain:`disputes`,question:`Which cards have been charged back more than once?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.with_card`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(:Authorization)-[:WITH_CARD]->(c:Card)
WITH c, count(DISTINCT cb) AS chargebacks
WHERE chargebacks > 1
RETURN c.id AS card, chargebacks
ORDER BY chargebacks DESC
LIMIT 50
`},{id:`CQ-15`,domain:`disputes`,question:`Which issuers file the most chargebacks against this acquirer's merchants?`,walks:[`Merchant.acquired_by`,`Authorization.at_merchant`,`Chargeback.disputes`,`Capture.captures`,`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`],answered_in:`neptune`,query:`MATCH (:Acquirer {id: $acquirer})<-[:ACQUIRED_BY]-(:Merchant)<-[:AT_MERCHANT]-(a:Authorization)
MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(a)
MATCH (a)-[:WITH_CARD]->(:Card)-[:IN_BIN_RANGE]->(:BinRange)-[:ASSIGNED_TO]->(i:Issuer)
RETURN i.id AS issuer, count(DISTINCT cb) AS chargebacks
ORDER BY chargebacks DESC
LIMIT 10
`},{id:`CQ-16`,domain:`disputes`,question:`Which of this merchant's chargebacks followed a fraud report on the same authorization?`,walks:[`FraudReport.reports`,`Authorization.at_merchant`,`Chargeback.disputes`,`Capture.captures`],answered_in:`neptune`,query:`MATCH (fr:FraudReport)-[:REPORTS]->(a:Authorization)-[:AT_MERCHANT]->(:Merchant {id: $merchant})
MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(a)
WHERE fr.reported_at <= cb.opened_at
RETURN a.id AS authorization, fr.id AS fraud_report, cb.id AS chargeback
LIMIT 100
`},{id:`CQ-17`,domain:`disputes`,question:`For each reason code, how many chargebacks came in this month, and how many did we represent?`,walks:[`Chargeback.has_reason`,`Representment.responds_to`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:HAS_REASON]->(rc:ReasonCode)
WHERE cb.opened_at >= $month_start
OPTIONAL MATCH (rep:Representment)-[:RESPONDS_TO]->(cb)
RETURN rc.network AS network, rc.code AS reason, count(DISTINCT cb) AS chargebacks,
       count(DISTINCT rep) AS represented
ORDER BY chargebacks DESC
LIMIT 50
`},{id:`CQ-18`,domain:`disputes`,question:`Which documents mention this chargeback?`,walks:[`Chunk.mentions`,`Chunk.part_of`],answered_in:`neptune`,query:`MATCH (k:Chunk)-[:MENTIONS]->(:Chargeback {id: $chargeback})
MATCH (k)-[:PART_OF]->(doc:Document)
RETURN DISTINCT doc.id AS document, doc.kind AS kind
LIMIT 20
`},{id:`CQ-19`,domain:`disputes`,question:`Tell the whole story of this dispute, from authorization to the evidence we sent.`,walks:[`Chargeback.disputes`,`Capture.captures`,`Representment.responds_to`,`Representment.has_evidence`],answered_in:`neptune`,query:`MATCH (cb:Chargeback {id: $chargeback})-[:DISPUTES]->(cap:Capture)-[:CAPTURES]->(a:Authorization)
OPTIONAL MATCH (rep:Representment)-[:RESPONDS_TO]->(cb)
OPTIONAL MATCH (rep)-[:HAS_EVIDENCE]->(doc:Document)
RETURN a.id AS authorization, a.authorized_at AS authorized_at, cap.id AS capture,
       cb.id AS chargeback, rep.id AS representment, collect(doc.id) AS evidence
LIMIT 1
`},{id:`CQ-20`,domain:`disputes`,question:`Which restaurants (MCC 5812) had 13.1 chargebacks last month?`,walks:[`Chargeback.has_reason`,`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:HAS_REASON]->(:ReasonCode {id: $reason})
MATCH (cb)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(:Authorization)-[:AT_MERCHANT]->(m:Merchant)
WHERE m.mcc = $mcc AND cb.opened_at >= $month_start AND cb.opened_at < $month_end
RETURN m.id AS merchant, m.name AS name, count(DISTINCT cb) AS chargebacks
ORDER BY chargebacks DESC
LIMIT 20
`},{id:`CQ-21`,domain:`disputes`,question:`How many chargebacks did this merchant get each month over the last year, and how much had those transactions captured?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT DATE_TRUNC('month', cb.opened_at) AS month,
       COUNT(*) AS chargebacks,
       SUM(c.amount) AS captured_amount
FROM fct_chargeback cb
JOIN fct_capture c ON c.capture_id = cb.capture_id                    -- Chargeback.disputes
JOIN fct_authorization a ON a.authorization_id = c.authorization_id   -- Capture.captures
WHERE a.merchant_id = :merchant_id                                    -- Authorization.at_merchant
  AND cb.opened_at >= DATEADD('month', -12, CURRENT_DATE)
GROUP BY 1
ORDER BY 1
LIMIT 12;
`},{id:`CQ-22`,domain:`disputes`,question:`What is this merchant's dispute ratio this month, chargebacks over settled transactions?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`,`Settlement.settles`],answered_in:`snowflake`,query:`WITH settled AS (
  SELECT COUNT(DISTINCT c.capture_id) AS n
  FROM fct_settlement_item s
  JOIN fct_capture c ON c.capture_id = s.capture_id                   -- Settlement.settles
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE a.merchant_id = :merchant_id                                  -- Authorization.at_merchant
    AND s.settled_at >= DATE_TRUNC('month', CURRENT_DATE)
),
disputed AS (
  SELECT COUNT(*) AS n
  FROM fct_chargeback cb
  JOIN fct_capture c ON c.capture_id = cb.capture_id                  -- Chargeback.disputes
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE a.merchant_id = :merchant_id                                  -- Authorization.at_merchant
    AND cb.opened_at >= DATE_TRUNC('month', CURRENT_DATE)
)
SELECT disputed.n AS chargebacks, settled.n AS settled_transactions,
       disputed.n / NULLIF(settled.n, 0) AS dispute_ratio
FROM disputed, settled
LIMIT 1;
`},{id:`CQ-23`,domain:`disputes`,question:`How did chargebacks by reason code move week to week this quarter?`,walks:[`Chargeback.has_reason`],answered_in:`snowflake`,query:`SELECT DATE_TRUNC('week', cb.opened_at) AS week, rc.network, rc.code,
       COUNT(*) AS chargebacks
FROM fct_chargeback cb
JOIN dim_reason_code rc ON rc.reason_code_id = cb.reason_code_id   -- Chargeback.has_reason
WHERE cb.opened_at >= DATE_TRUNC('quarter', CURRENT_DATE)
GROUP BY 1, 2, 3
ORDER BY 1, 4 DESC
LIMIT 500;
`},{id:`CQ-24`,domain:`disputes`,question:`What share of chargebacks did we represent over the last six months, by reason code?`,walks:[`Chargeback.has_reason`,`Representment.responds_to`],answered_in:`snowflake`,query:`SELECT rc.network, rc.code,
       COUNT(DISTINCT cb.chargeback_id) AS chargebacks,
       COUNT(DISTINCT rep.representment_id) AS represented,
       represented / NULLIF(chargebacks, 0) AS represent_rate
FROM fct_chargeback cb
JOIN dim_reason_code rc ON rc.reason_code_id = cb.reason_code_id      -- Chargeback.has_reason
LEFT JOIN fct_representment rep ON rep.chargeback_id = cb.chargeback_id   -- Representment.responds_to
WHERE cb.opened_at >= DATEADD('month', -6, CURRENT_DATE)
GROUP BY 1, 2
ORDER BY chargebacks DESC
LIMIT 50;
`},{id:`CQ-25`,domain:`disputes`,question:`How many days did we take to represent a chargeback last quarter?`,walks:[`Representment.responds_to`],answered_in:`snowflake`,query:`SELECT AVG(DATEDIFF('day', cb.opened_at, rep.opened_at)) AS average_days,
       MEDIAN(DATEDIFF('day', cb.opened_at, rep.opened_at)) AS median_days
FROM fct_representment rep
JOIN fct_chargeback cb ON cb.chargeback_id = rep.chargeback_id   -- Representment.responds_to
WHERE rep.opened_at >= DATEADD('quarter', -1, DATE_TRUNC('quarter', CURRENT_DATE))
  AND rep.opened_at < DATE_TRUNC('quarter', CURRENT_DATE)
LIMIT 1;
`},{id:`CQ-26`,domain:`disputes`,question:`Which disputes did we settle with a refund instead of a representment?`,walks:[`Chargeback.disputes`,`Refund.refunds`,`Representment.responds_to`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(cap:Capture)<-[:REFUNDS]-(rf:Refund)
WHERE rf.refunded_at > cb.opened_at AND NOT (cb)<-[:RESPONDS_TO]-(:Representment)
RETURN cb.id AS chargeback, rf.id AS refund, rf.amount AS refunded
LIMIT 100
`},{id:`CQ-27`,domain:`disputes`,question:`What is our win rate on representments, by reason code?`,walks:[`Representment.responds_to`,`Chargeback.has_reason`,`DisputeOutcome.disputes`,`Chargeback.disputes`],answered_in:`neptune`,query:`MATCH (rep:Representment)-[:RESPONDS_TO]->(cb:Chargeback)-[:HAS_REASON]->(rc:ReasonCode)
MATCH (out:DisputeOutcome)-[:DISPUTES]->(:Capture)<-[:DISPUTES]-(cb)
WHERE cb.opened_at >= $since
WITH rc, count(DISTINCT cb) AS represented,
     count(DISTINCT CASE WHEN out.won_by = 'acquirer' THEN cb END) AS won
RETURN rc.id AS reason, represented, won, toFloat(won) / represented AS win_rate
ORDER BY represented DESC
LIMIT 20
`},{id:`CQ-28`,domain:`disputes`,question:`Which chargebacks are close to missing their response deadline?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`,`Representment.responds_to`,`DisputeOutcome.responds_to`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(:Authorization)-[:AT_MERCHANT]->(m:Merchant)
WHERE cb.respond_by >= $now AND cb.respond_by < $soon
  AND NOT (cb)<-[:RESPONDS_TO]-(:Representment)
  AND NOT (cb)<-[:RESPONDS_TO]-(:DisputeOutcome)
RETURN cb.id AS chargeback, m.id AS merchant, cb.respond_by AS respond_by,
       cb.amount AS amount, cb.currency AS currency
ORDER BY respond_by
LIMIT 100
`},{id:`CQ-29`,domain:`disputes`,question:`How much was disputed, as opposed to captured?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(c:Capture)-[:CAPTURES]->(:Authorization)-[:AT_MERCHANT]->(:Merchant {id: $merchant})
WHERE cb.opened_at >= $since
RETURN cb.id AS chargeback, cb.amount AS disputed, cb.currency AS disputed_currency,
       c.amount AS captured, c.currency AS captured_currency,
       cb.currency = c.currency AND cb.amount < c.amount AS partial
ORDER BY cb.opened_at DESC
LIMIT 100
`},{id:`CQ-30`,domain:`disputes`,question:`Which disputes went to arbitration, and how did the network rule?`,walks:[`Arbitration.responds_to`,`PreArbitration.responds_to`,`Representment.responds_to`,`DisputeOutcome.responds_to`],answered_in:`neptune`,query:`MATCH (arb:Arbitration)-[:RESPONDS_TO]->(:PreArbitration)-[:RESPONDS_TO]->(:Representment)-[:RESPONDS_TO]->(cb:Chargeback)
WHERE arb.opened_at >= $since
OPTIONAL MATCH (out:DisputeOutcome)-[:RESPONDS_TO]->(arb)
RETURN cb.id AS chargeback, arb.id AS arbitration, arb.opened_at AS filed_at,
       out.won_by AS won_by, out.amount AS amount, out.currency AS currency
ORDER BY filed_at DESC
LIMIT 100
`},{id:`CQ-31`,domain:`disputes`,question:`Which retrieval requests turned into chargebacks?`,walks:[`RetrievalRequest.disputes`,`Chargeback.disputes`],answered_in:`neptune`,query:`MATCH (rr:RetrievalRequest)-[:DISPUTES]->(:Capture)<-[:DISPUTES]-(cb:Chargeback)
WHERE rr.opened_at >= $since AND cb.opened_at > rr.opened_at
RETURN rr.id AS retrieval_request, rr.opened_at AS requested_at,
       cb.id AS chargeback, cb.opened_at AS charged_back_at
ORDER BY requested_at DESC
LIMIT 100
`},{id:`CQ-32`,domain:`disputes`,question:`Which chargebacks were fraud disputes, and which were consumer disputes?`,answered_in:`neptune`,gap:`Reason codes have no category, such as fraud, authorization, processing error or consumer dispute, to group them across networks.`},{id:`CQ-33`,domain:`disputes`,question:`Which merchants are in a network's dispute monitoring program this month, and at what tier?`,answered_in:`snowflake`,gap:`Monitoring programs, their tiers and their thresholds aren't modelled. The retrieval walkthrough computes a VAMP-style ratio, but no class says which program a merchant is in.`},{id:`CQ-34`,domain:`disputes`,question:`Which chargebacks did the cardholder later withdraw?`,walks:[`DisputeOutcome.disputes`,`Chargeback.disputes`],answered_in:`neptune`,query:`MATCH (out:DisputeOutcome {closure: 'withdrawn'})-[:DISPUTES]->(:Capture)<-[:DISPUTES]-(cb:Chargeback)
WHERE out.opened_at >= $since
RETURN cb.id AS chargeback, cb.opened_at AS opened_at, out.opened_at AS withdrawn_at,
       cb.amount AS amount, cb.currency AS currency
ORDER BY withdrawn_at DESC
LIMIT 100
`},{id:`CQ-03`,domain:`authorization`,question:`Show the full lifecycle of this authorization.`,walks:[`Capture.captures`,`Settlement.settles`,`Refund.refunds`,`Chargeback.disputes`],answered_in:`neptune`,query:`MATCH (a:Authorization {id: $authorization})
OPTIONAL MATCH (cap:Capture)-[:CAPTURES]->(a)
OPTIONAL MATCH (s:Settlement)-[:SETTLES]->(cap)
OPTIONAL MATCH (r:Refund)-[:REFUNDS]->(cap)
OPTIONAL MATCH (cb:Chargeback)-[:DISPUTES]->(cap)
RETURN a.id AS authorization, cap.id AS capture, collect(DISTINCT s.id) AS settlements,
       collect(DISTINCT r.id) AS refunds, collect(DISTINCT cb.id) AS chargebacks
LIMIT 1
`},{id:`CQ-04`,domain:`authorization`,question:`Which response codes spiked for this BIN range today?`,walks:[`Authorization.with_card`,`Card.in_bin_range`,`Authorization.has_response`],answered_in:`snowflake`,query:`WITH daily AS (
  SELECT a.response_code, DATE_TRUNC('day', a.authorized_at) AS auth_day, COUNT(*) AS n
  FROM fct_authorization a
  JOIN dim_card c ON c.card_id = a.card_id          -- Authorization.with_card
  JOIN dim_bin_range b ON b.bin_id = c.bin_id       -- Card.in_bin_range
  WHERE b.prefix = :bin_prefix
    AND a.authorized_at >= DATEADD('day', -7, CURRENT_DATE)
  GROUP BY 1, 2
)
SELECT response_code,                               -- Authorization.has_response
       SUM(IFF(auth_day = CURRENT_DATE, n, 0)) AS today,
       AVG(IFF(auth_day < CURRENT_DATE, n, NULL)) AS daily_average
FROM daily
GROUP BY response_code
ORDER BY today / NULLIF(daily_average, 0) DESC NULLS LAST
LIMIT 20;
`},{id:`CQ-35`,domain:`authorization`,question:`What was each issuer's approval rate yesterday?`,walks:[`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT i.issuer_id, i.name,
       COUNT(*) AS authorizations,
       COUNT_IF(a.response_code = '00') / COUNT(*) AS approval_rate   -- Authorization.has_response
FROM fct_authorization a
JOIN dim_card c ON c.card_id = a.card_id                -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = c.bin_id             -- Card.in_bin_range
JOIN dim_issuer i ON i.issuer_id = b.issuer_id          -- BinRange.assigned_to
WHERE a.authorized_at >= DATEADD('day', -1, CURRENT_DATE) AND a.authorized_at < CURRENT_DATE
GROUP BY 1, 2
ORDER BY authorizations DESC
LIMIT 50;
`},{id:`CQ-36`,domain:`authorization`,question:`Which merchants' approval rates fell most this week, compared with last week?`,walks:[`Authorization.at_merchant`,`Authorization.has_response`],answered_in:`snowflake`,query:`WITH weekly AS (
  SELECT a.merchant_id,                                             -- Authorization.at_merchant
         DATE_TRUNC('week', a.authorized_at) AS week,
         COUNT_IF(a.response_code = '00') / COUNT(*) AS approval_rate   -- Authorization.has_response
  FROM fct_authorization a
  WHERE a.authorized_at >= DATEADD('week', -1, DATE_TRUNC('week', CURRENT_DATE))
  GROUP BY 1, 2
)
SELECT merchant_id,
       MAX(IFF(week = DATE_TRUNC('week', CURRENT_DATE), approval_rate, NULL))
         - MAX(IFF(week < DATE_TRUNC('week', CURRENT_DATE), approval_rate, NULL)) AS change
FROM weekly
GROUP BY merchant_id
ORDER BY change ASC NULLS LAST
LIMIT 20;
`},{id:`CQ-37`,domain:`authorization`,question:`What were the most common decline codes on card-not-present authorizations last month?`,walks:[`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT a.response_code, COUNT(*) AS declines                -- Authorization.has_response
FROM fct_authorization a
WHERE a.channel = 'card_not_present'
  AND a.response_code <> '00'
  AND a.authorized_at >= DATEADD('month', -1, DATE_TRUNC('month', CURRENT_DATE))
  AND a.authorized_at < DATE_TRUNC('month', CURRENT_DATE)
GROUP BY 1
ORDER BY declines DESC
LIMIT 20;
`},{id:`CQ-38`,domain:`authorization`,question:`How much did each merchant authorize and capture yesterday, by currency?`,walks:[`Authorization.at_merchant`,`Capture.captures`],answered_in:`snowflake`,query:`WITH captured AS (
  SELECT c.authorization_id, SUM(c.amount) AS amount
  FROM fct_capture c
  GROUP BY 1
)
SELECT a.merchant_id, a.currency,                                 -- Authorization.at_merchant
       SUM(a.amount) AS authorized, SUM(captured.amount) AS captured
FROM fct_authorization a
LEFT JOIN captured ON captured.authorization_id = a.authorization_id   -- Capture.captures
WHERE a.authorized_at >= DATEADD('day', -1, CURRENT_DATE) AND a.authorized_at < CURRENT_DATE
GROUP BY 1, 2
ORDER BY authorized DESC
LIMIT 100;
`},{id:`CQ-39`,domain:`authorization`,question:`Which approved authorizations from the last month were never captured within seven days?`,walks:[`Authorization.has_response`,`Capture.captures`],answered_in:`snowflake`,query:`SELECT a.authorization_id, a.merchant_id, a.authorized_at, a.amount, a.currency
FROM fct_authorization a
LEFT JOIN fct_capture c ON c.authorization_id = a.authorization_id   -- Capture.captures
WHERE a.response_code = '00'                                         -- Authorization.has_response
  AND c.capture_id IS NULL
  AND a.authorized_at < DATEADD('day', -7, CURRENT_TIMESTAMP)
  AND a.authorized_at >= DATEADD('day', -30, CURRENT_TIMESTAMP)
ORDER BY a.authorized_at
LIMIT 100;
`},{id:`CQ-40`,domain:`authorization`,question:`Which authorizations were captured for more than they approved?`,walks:[`Capture.captures`],answered_in:`snowflake`,query:`SELECT a.authorization_id, a.merchant_id, a.amount AS authorized, SUM(c.amount) AS captured
FROM fct_authorization a
JOIN fct_capture c ON c.authorization_id = a.authorization_id   -- Capture.captures
WHERE a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY a.authorization_id, a.merchant_id, a.amount
HAVING SUM(c.amount) > a.amount
ORDER BY captured - authorized DESC
LIMIT 100;
`},{id:`CQ-41`,domain:`authorization`,question:`How many authorizations came from each BIN range yesterday, card present and not present?`,walks:[`Authorization.with_card`,`Card.in_bin_range`],answered_in:`snowflake`,query:`SELECT b.prefix, a.channel, COUNT(*) AS authorizations
FROM fct_authorization a
JOIN dim_card c ON c.card_id = a.card_id              -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = c.bin_id           -- Card.in_bin_range
WHERE a.authorized_at >= DATEADD('day', -1, CURRENT_DATE) AND a.authorized_at < CURRENT_DATE
GROUP BY 1, 2
ORDER BY authorizations DESC
LIMIT 200;
`},{id:`CQ-42`,domain:`authorization`,question:`What is the approval rate by card network and channel this month?`,walks:[`Authorization.with_card`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT c.network, a.channel, COUNT(*) AS authorizations,
       COUNT_IF(a.response_code = '00') / COUNT(*) AS approval_rate   -- Authorization.has_response
FROM fct_authorization a
JOIN dim_card c ON c.card_id = a.card_id              -- Authorization.with_card
WHERE a.authorized_at >= DATE_TRUNC('month', CURRENT_DATE)
GROUP BY 1, 2
ORDER BY 1, 2
LIMIT 20;
`},{id:`CQ-43`,domain:`authorization`,question:`Which acquirers' merchants had the lowest approval rates last week?`,walks:[`Authorization.at_merchant`,`Merchant.acquired_by`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT m.acquirer_id,                                                 -- Merchant.acquired_by
       COUNT(*) AS authorizations,
       COUNT_IF(a.response_code = '00') / COUNT(*) AS approval_rate   -- Authorization.has_response
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id                  -- Authorization.at_merchant
WHERE a.authorized_at >= DATEADD('week', -1, DATE_TRUNC('week', CURRENT_DATE))
  AND a.authorized_at < DATE_TRUNC('week', CURRENT_DATE)
GROUP BY 1
ORDER BY approval_rate ASC
LIMIT 20;
`},{id:`CQ-44`,domain:`authorization`,question:`In which hours today did this merchant see the most authorizations, and from how many cards?`,walks:[`Authorization.at_merchant`,`Authorization.with_card`],answered_in:`snowflake`,query:`SELECT DATE_TRUNC('hour', a.authorized_at) AS hour,
       COUNT(*) AS authorizations,
       COUNT(DISTINCT a.card_id) AS cards                   -- Authorization.with_card
FROM fct_authorization a
WHERE a.merchant_id = :merchant_id                          -- Authorization.at_merchant
  AND a.authorized_at >= CURRENT_DATE
GROUP BY 1
ORDER BY authorizations DESC
LIMIT 24;
`},{id:`CQ-45`,domain:`authorization`,question:`Which device did this disputed authorization come from, and where else has that device been seen?`,walks:[`Authorization.from_device`,`Device.seen_at`],answered_in:`neptune`,query:`MATCH (a:Authorization {id: $authorization})-[:FROM_DEVICE]->(d:Device)
MATCH (d)-[s:SEEN_AT]->(m:Merchant)
RETURN d.id AS device, m.id AS merchant, s.auths AS auths, s.last_seen AS last_seen
ORDER BY last_seen DESC
LIMIT 50
`},{id:`CQ-46`,domain:`authorization`,question:`Which issuer approved the authorization behind this chargeback, and through which BIN range?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`],answered_in:`neptune`,query:`MATCH (:Chargeback {id: $chargeback})-[:DISPUTES]->(:Capture)-[:CAPTURES]->(a:Authorization)-[:WITH_CARD]->(c:Card)
MATCH (c)-[:IN_BIN_RANGE]->(b:BinRange)-[:ASSIGNED_TO]->(i:Issuer)
RETURN a.id AS authorization, c.id AS card, b.prefix AS bin, i.id AS issuer
LIMIT 1
`},{id:`CQ-47`,domain:`authorization`,question:`Which disputed transactions were on-us, with the same bank as issuer and acquirer?`,walks:[`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`,`Authorization.at_merchant`,`Merchant.acquired_by`,`Organization.acts_as`],answered_in:`neptune`,query:`MATCH (a:Authorization)-[:WITH_CARD]->(:Card)-[:IN_BIN_RANGE]->(:BinRange)-[:ASSIGNED_TO]->(i:Issuer)
MATCH (a)-[:AT_MERCHANT]->(:Merchant)-[:ACQUIRED_BY]->(acq:Acquirer)
MATCH (i)<-[:ACTS_AS]-(bank:Organization)-[:ACTS_AS]->(acq)
RETURN a.id AS authorization, bank.id AS bank, bank.name AS name
LIMIT 100
`},{id:`CQ-48`,domain:`authorization`,question:`Which of this card's authorizations are in the graph, and which dispute or fraud report brought each one in?`,walks:[`Authorization.with_card`,`Chargeback.disputes`,`Capture.captures`,`FraudReport.reports`],answered_in:`neptune`,query:`MATCH (a:Authorization)-[:WITH_CARD]->(:Card {id: $card})
OPTIONAL MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(a)
OPTIONAL MATCH (fr:FraudReport)-[:REPORTS]->(a)
RETURN a.id AS authorization, collect(DISTINCT cb.id) AS chargebacks,
       collect(DISTINCT fr.id) AS fraud_reports
LIMIT 100
`},{id:`CQ-49`,domain:`authorization`,question:`What was this merchant's average authorization amount by channel over the last 30 days?`,walks:[`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT a.channel, a.currency, COUNT(*) AS authorizations, AVG(a.amount) AS average_amount
FROM fct_authorization a
WHERE a.merchant_id = :merchant_id                          -- Authorization.at_merchant
  AND a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1, 2
ORDER BY authorizations DESC
LIMIT 10;
`},{id:`CQ-50`,domain:`authorization`,question:`Which response codes does this issuer return most on card-not-present authorizations?`,walks:[`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT a.response_code, COUNT(*) AS authorizations          -- Authorization.has_response
FROM fct_authorization a
JOIN dim_card c ON c.card_id = a.card_id                    -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = c.bin_id                 -- Card.in_bin_range
WHERE b.issuer_id = :issuer_id                              -- BinRange.assigned_to
  AND a.channel = 'card_not_present'
  AND a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1
ORDER BY authorizations DESC
LIMIT 20;
`},{id:`CQ-51`,domain:`authorization`,question:`Which merchant category codes had the highest decline rate this month?`,walks:[`Authorization.at_merchant`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT m.mcc, COUNT(*) AS authorizations,
       COUNT_IF(a.response_code <> '00') / COUNT(*) AS decline_rate   -- Authorization.has_response
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id                  -- Authorization.at_merchant
WHERE a.authorized_at >= DATE_TRUNC('month', CURRENT_DATE)
GROUP BY 1
HAVING COUNT(*) >= 1000
ORDER BY decline_rate DESC
LIMIT 20;
`},{id:`CQ-52`,domain:`authorization`,question:`At which merchants did this card's disputed or fraud-reported authorizations happen?`,walks:[`Authorization.with_card`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (a:Authorization)-[:WITH_CARD]->(:Card {id: $card})
MATCH (a)-[:AT_MERCHANT]->(m:Merchant)
RETURN m.id AS merchant, m.name AS name, count(a) AS authorizations
ORDER BY authorizations DESC
LIMIT 50
`},{id:`CQ-53`,domain:`authorization`,question:`How many authorizations did this acquirer's merchants get per response code, hour by hour, today?`,walks:[`Authorization.at_merchant`,`Merchant.acquired_by`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT DATE_TRUNC('hour', a.authorized_at) AS hour,
       a.response_code,                                     -- Authorization.has_response
       COUNT(*) AS authorizations
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id        -- Authorization.at_merchant
WHERE m.acquirer_id = :acquirer_id                          -- Merchant.acquired_by
  AND a.authorized_at >= CURRENT_DATE
GROUP BY 1, 2
ORDER BY 1, 3 DESC
LIMIT 500;
`},{id:`CQ-54`,domain:`authorization`,question:`Which authorizations were authenticated with 3-D Secure, and did the challenge succeed?`,walks:[`Authorization.authenticated_by`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT m.merchant_id, m.name,
       COUNT(*) AS authenticated,
       COUNT_IF(n.challenged) AS challenged,
       COUNT_IF(n.challenged AND n.authentication_result = 'authenticated') / NULLIF(COUNT_IF(n.challenged), 0) AS challenge_success
FROM fct_authorization a
JOIN fct_authentication n ON n.authentication_id = a.authentication_id   -- Authorization.authenticated_by
JOIN dim_merchant m ON m.merchant_id = a.merchant_id                    -- Authorization.at_merchant
WHERE a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1, 2
ORDER BY authenticated DESC
LIMIT 50;
`},{id:`CQ-55`,domain:`authorization`,question:`Which authorizations were reversed before capture?`,walks:[`Reversal.reverses`,`Capture.captures`],answered_in:`snowflake`,query:`SELECT a.authorization_id, a.merchant_id, a.amount AS authorized,
       r.amount AS reversed, r.reversed_at
FROM fct_reversal r
JOIN fct_authorization a ON a.authorization_id = r.authorization_id   -- Reversal.reverses
LEFT JOIN fct_capture c ON c.authorization_id = a.authorization_id    -- Capture.captures
WHERE r.reversed_at >= DATEADD('day', -30, CURRENT_DATE)
  AND (c.capture_id IS NULL OR c.captured_at > r.reversed_at)
ORDER BY r.reversed_at DESC
LIMIT 100;
`},{id:`CQ-56`,domain:`authorization`,question:`Which authorizations used a network token or a digital wallet?`,walks:[`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT m.merchant_id, m.name, a.credential, a.token_requestor,
       COUNT(*) AS authorizations
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id   -- Authorization.at_merchant
WHERE a.credential IN ('card_on_file_token', 'wallet_token')
  AND a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1, 2, 3, 4
ORDER BY authorizations DESC
LIMIT 100;
`},{id:`CQ-57`,domain:`authorization`,question:`How do approval rates differ between domestic and cross-border authorizations?`,walks:[`Authorization.at_merchant`,`Authorization.with_card`,`Card.in_bin_range`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT IFF(m.country = b.country, 'domestic', 'cross-border') AS corridor,
       COUNT(*) AS authorizations,
       COUNT_IF(a.response_code = '00') / COUNT(*) AS approval_rate   -- Authorization.has_response
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id    -- Authorization.at_merchant
JOIN dim_card c ON c.card_id = a.card_id                -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = c.bin_id             -- Card.in_bin_range
WHERE a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1
ORDER BY 1
LIMIT 10;
`},{id:`CQ-58`,domain:`authorization`,question:`Which hotel and car rental authorizations were incremental or estimated?`,walks:[`Authorization.at_merchant`,`Authorization.increments`],answered_in:`snowflake`,query:`SELECT e.authorization_id AS estimated, m.name, m.mcc, e.amount AS estimated_amount,
       COUNT(i.authorization_id) AS increments,
       e.amount + COALESCE(SUM(i.amount), 0) AS total_authorized
FROM fct_authorization e
JOIN dim_merchant m ON m.merchant_id = e.merchant_id                              -- Authorization.at_merchant
LEFT JOIN fct_authorization i ON i.increments_authorization_id = e.authorization_id  -- Authorization.increments
WHERE e.authorization_type = 'estimated'
  AND m.mcc IN ('7011', '7512')   -- hotels and car rental (ISO 18245)
  AND e.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1, 2, 3, 4
ORDER BY increments DESC
LIMIT 100;
`},{id:`CQ-59`,domain:`authorization`,question:`What share of authorizations were on credit, debit and prepaid cards?`,walks:[`Authorization.with_card`,`Card.in_bin_range`],answered_in:`snowflake`,query:`SELECT b.funding_source,
       COUNT(*) AS authorizations,
       RATIO_TO_REPORT(COUNT(*)) OVER () AS share
FROM fct_authorization a
JOIN dim_card c ON c.card_id = a.card_id                -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = c.bin_id             -- Card.in_bin_range
WHERE a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1
ORDER BY authorizations DESC
LIMIT 10;
`},{id:`CQ-60`,domain:`authorization`,question:`Which recurring payments are failing for this merchant?`,walks:[`Authorization.at_merchant`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT a.card_id, COUNT(*) AS attempts,
       COUNT_IF(a.response_code <> '00') AS declined,   -- Authorization.has_response
       MAX(a.authorized_at) AS last_attempt
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id   -- Authorization.at_merchant
WHERE m.merchant_id = :merchant_id
  AND a.initiated_by = 'merchant' AND a.standing_instruction = 'recurring'
  AND a.authorized_at >= DATEADD('day', -90, CURRENT_DATE)
GROUP BY 1
HAVING declined > 0
ORDER BY declined DESC
LIMIT 100;
`},{id:`CQ-61`,domain:`authorization`,question:`Which authorizations were only partly approved?`,walks:[`Authorization.at_merchant`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT a.authorization_id, m.merchant_id, m.name,
       a.amount AS requested, a.approved_amount, a.currency
FROM fct_authorization a
JOIN dim_merchant m ON m.merchant_id = a.merchant_id   -- Authorization.at_merchant
WHERE a.response_code = '10'                            -- Authorization.has_response
  AND a.authorized_at >= DATEADD('day', -30, CURRENT_DATE)
ORDER BY a.amount - a.approved_amount DESC
LIMIT 100;
`},{id:`CQ-62`,domain:`authorization`,question:`Which authorizations did the network approve in stand-in while the issuer was down?`,walks:[`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT i.issuer_id, i.name, DATE_TRUNC('hour', a.authorized_at) AS hour,
       COUNT(*) AS stand_in_approvals, SUM(a.amount) AS amount
FROM fct_authorization a
JOIN dim_card c ON c.card_id = a.card_id                -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = c.bin_id             -- Card.in_bin_range
JOIN dim_issuer i ON i.issuer_id = b.issuer_id          -- BinRange.assigned_to
WHERE a.decided_by = 'network_stand_in'
  AND a.response_code = '00'                            -- Authorization.has_response
  AND a.authorized_at >= DATEADD('day', -7, CURRENT_DATE)
GROUP BY 1, 2, 3
ORDER BY stand_in_approvals DESC
LIMIT 100;
`},{id:`CQ-05`,domain:`settlement`,question:`Which captures haven't settled after 3 days?`,walks:[`Settlement.settles`],answered_in:`snowflake`,query:`SELECT c.capture_id, c.authorization_id, c.captured_at

LEFT JOIN fct_settlement_item s ON s.capture_id = c.capture_id   -- Settlement.settles
WHERE s.capture_id IS NULL

`},{id:`CQ-63`,domain:`settlement`,question:`How much did each acquirer settle yesterday, by currency?`,walks:[`Settlement.settles`,`Capture.captures`,`Authorization.at_merchant`,`Merchant.acquired_by`],answered_in:`snowflake`,query:`SELECT m.acquirer_id, c.currency,                                     -- Merchant.acquired_by
       SUM(c.amount) AS settled
FROM fct_settlement_item s
JOIN fct_capture c ON c.capture_id = s.capture_id                     -- Settlement.settles
JOIN fct_authorization a ON a.authorization_id = c.authorization_id   -- Capture.captures
JOIN dim_merchant m ON m.merchant_id = a.merchant_id                  -- Authorization.at_merchant
WHERE s.settled_at >= DATEADD('day', -1, CURRENT_DATE) AND s.settled_at < CURRENT_DATE

`},{id:`CQ-64`,domain:`settlement`,question:`How many hours does it take captures to settle, by acquirer, this month?`,walks:[`Settlement.settles`,`Capture.captures`,`Authorization.at_merchant`,`Merchant.acquired_by`],answered_in:`snowflake`,query:`SELECT m.acquirer_id,                                                 -- Merchant.acquired_by

       MAX(DATEDIFF('hour', c.captured_at, s.settled_at)) AS slowest_hours

JOIN fct_capture c ON c.capture_id = s.capture_id                     -- Settlement.settles

`},{id:`CQ-65`,domain:`settlement`,question:`Which captures were refunded more than once, or for more than was captured?`,walks:[`Refund.refunds`],answered_in:`snowflake`,query:`SELECT c.capture_id, c.amount AS captured, SUM(r.amount) AS refunded, COUNT(*) AS refunds
FROM fct_capture c
JOIN fct_refund r ON r.capture_id = c.capture_id     -- Refund.refunds
GROUP BY c.capture_id, c.amount
HAVING COUNT(*) > 1 OR SUM(r.amount) > c.amount
ORDER BY refunded DESC
LIMIT 100;
`},{id:`CQ-66`,domain:`settlement`,question:`What was each merchant's refund rate last month, refunded over captured amount?`,walks:[`Refund.refunds`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`WITH captured AS (
  SELECT a.merchant_id, c.currency, SUM(c.amount) AS amount           -- Authorization.at_merchant
  FROM fct_capture c
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE c.captured_at >= DATEADD('month', -1, DATE_TRUNC('month', CURRENT_DATE))
    AND c.captured_at < DATE_TRUNC('month', CURRENT_DATE)
  GROUP BY 1, 2
),
refunded AS (
  SELECT a.merchant_id, r.currency, SUM(r.amount) AS amount           -- Authorization.at_merchant
  FROM fct_refund r
  JOIN fct_capture c ON c.capture_id = r.capture_id                   -- Refund.refunds
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE r.refunded_at >= DATEADD('month', -1, DATE_TRUNC('month', CURRENT_DATE))
    AND r.refunded_at < DATE_TRUNC('month', CURRENT_DATE)
  GROUP BY 1, 2
)
SELECT captured.merchant_id, captured.currency, captured.amount AS captured,
       refunded.amount AS refunded, refunded.amount / NULLIF(captured.amount, 0) AS refund_rate
FROM captured
LEFT JOIN refunded ON refunded.merchant_id = captured.merchant_id AND refunded.currency = captured.currency
ORDER BY refund_rate DESC NULLS LAST
LIMIT 50;
`},{id:`CQ-67`,domain:`settlement`,question:`How much did this merchant capture, refund and have charged back each day this month?`,walks:[`Capture.captures`,`Authorization.at_merchant`,`Refund.refunds`,`Chargeback.disputes`],answered_in:`snowflake`,query:`WITH merchant_captures AS (
  SELECT c.capture_id, c.captured_at, c.amount
  FROM fct_capture c
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE a.merchant_id = :merchant_id                                  -- Authorization.at_merchant
)
SELECT d.day,
       (SELECT SUM(amount) FROM merchant_captures mc
         WHERE DATE_TRUNC('day', mc.captured_at) = d.day) AS captured,
       (SELECT SUM(r.amount) FROM fct_refund r
         JOIN merchant_captures mc ON mc.capture_id = r.capture_id    -- Refund.refunds
         WHERE DATE_TRUNC('day', r.refunded_at) = d.day) AS refunded,
       (SELECT SUM(mc.amount) FROM fct_chargeback cb
         JOIN merchant_captures mc ON mc.capture_id = cb.capture_id   -- Chargeback.disputes
         WHERE DATE_TRUNC('day', cb.opened_at) = d.day) AS charged_back
FROM (SELECT DISTINCT DATE_TRUNC('day', captured_at) AS day FROM merchant_captures
      WHERE captured_at >= DATE_TRUNC('month', CURRENT_DATE)) d
ORDER BY d.day
LIMIT 31;
`},{id:`CQ-68`,domain:`settlement`,question:`Which settlements paid out a capture that had already been fully refunded?`,walks:[`Settlement.settles`,`Refund.refunds`],answered_in:`snowflake`,query:`SELECT s.settlement_id, c.capture_id, c.amount AS captured, SUM(r.amount) AS refunded
FROM fct_settlement_item s
JOIN fct_capture c ON c.capture_id = s.capture_id     -- Settlement.settles
JOIN fct_refund r ON r.capture_id = c.capture_id      -- Refund.refunds
WHERE r.refunded_at < s.settled_at
GROUP BY s.settlement_id, c.capture_id, c.amount
HAVING SUM(r.amount) >= c.amount
LIMIT 100;
`},{id:`CQ-69`,domain:`settlement`,question:`Which captures were settled twice?`,walks:[`Settlement.settles`],answered_in:`snowflake`,query:`SELECT s.capture_id, COUNT(DISTINCT s.settlement_id) AS settlements   -- Settlement.settles

LIMIT 100;
`},{id:`CQ-70`,domain:`settlement`,question:`How much of what was captured yesterday settled, by currency?`,walks:[`Settlement.settles`],answered_in:`snowflake`,query:`SELECT c.currency,
       SUM(c.amount) AS captured,

LEFT JOIN fct_settlement_item s ON s.capture_id = c.capture_id   -- Settlement.settles
WHERE c.captured_at >= DATEADD('day', -1, CURRENT_DATE) AND c.captured_at < CURRENT_DATE
GROUP BY 1
ORDER BY captured DESC
LIMIT 50;
`},{id:`CQ-71`,domain:`settlement`,question:`Which merchants capture late, more than three days after authorization?`,walks:[`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT a.merchant_id,                                                 -- Authorization.at_merchant
       COUNT(*) AS captures,
       COUNT_IF(DATEDIFF('day', a.authorized_at, c.captured_at) > 3) AS late_captures
FROM fct_capture c

`},{id:`CQ-72`,domain:`settlement`,question:`Which settlement paid out the capture behind this chargeback, and was any of it refunded?`,walks:[`Chargeback.disputes`,`Settlement.settles`,`Refund.refunds`],answered_in:`neptune`,query:`MATCH (:Chargeback {id: $chargeback})-[:DISPUTES]->(cap:Capture)
OPTIONAL MATCH (s:Settlement)-[:SETTLES]->(cap)
OPTIONAL MATCH (rf:Refund)-[:REFUNDS]->(cap)

LIMIT 1
`},{id:`CQ-73`,domain:`settlement`,question:`Which disputed captures were never settled?`,walks:[`Chargeback.disputes`,`Settlement.settles`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(cap:Capture)

LIMIT 100
`},{id:`CQ-74`,domain:`settlement`,question:`Which merchants split their authorizations into several captures last month?`,walks:[`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`WITH per_authorization AS (
  SELECT c.authorization_id, COUNT(*) AS captures
  FROM fct_capture c
  WHERE c.captured_at >= DATEADD('month', -1, DATE_TRUNC('month', CURRENT_DATE))
  GROUP BY 1
)
SELECT a.merchant_id,                                                 -- Authorization.at_merchant
       COUNT_IF(p.captures > 1) AS split_authorizations,
       MAX(p.captures) AS most_captures
FROM per_authorization p
JOIN fct_authorization a ON a.authorization_id = p.authorization_id   -- Capture.captures
GROUP BY 1
HAVING split_authorizations > 0
ORDER BY split_authorizations DESC
LIMIT 50;
`},{id:`CQ-75`,domain:`settlement`,question:`How much did each merchant refund last week, by currency?`,walks:[`Refund.refunds`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT a.merchant_id, r.currency,                                     -- Authorization.at_merchant
       COUNT(*) AS refunds, SUM(r.amount) AS refunded
FROM fct_refund r
JOIN fct_capture c ON c.capture_id = r.capture_id                     -- Refund.refunds
JOIN fct_authorization a ON a.authorization_id = c.authorization_id   -- Capture.captures
WHERE r.refunded_at >= DATEADD('week', -1, DATE_TRUNC('week', CURRENT_DATE))
  AND r.refunded_at < DATE_TRUNC('week', CURRENT_DATE)
GROUP BY 1, 2
ORDER BY refunded DESC
LIMIT 100;
`},{id:`CQ-76`,domain:`settlement`,question:`How much of yesterday's captured volume hasn't settled yet, per acquirer?`,walks:[`Settlement.settles`,`Capture.captures`,`Authorization.at_merchant`,`Merchant.acquired_by`],answered_in:`snowflake`,query:`SELECT m.acquirer_id, c.currency,                                     -- Merchant.acquired_by
       SUM(c.amount) AS unsettled
FROM fct_capture c
JOIN fct_authorization a ON a.authorization_id = c.authorization_id   -- Capture.captures
JOIN dim_merchant m ON m.merchant_id = a.merchant_id                  -- Authorization.at_merchant
LEFT JOIN fct_settlement_item s ON s.capture_id = c.capture_id        -- Settlement.settles
WHERE s.capture_id IS NULL
  AND c.captured_at >= DATEADD('day', -1, CURRENT_DATE) AND c.captured_at < CURRENT_DATE
GROUP BY 1, 2
ORDER BY unsettled DESC
LIMIT 100;
`},{id:`CQ-77`,domain:`settlement`,question:`Which merchants refunded within an hour of capturing, and how often?`,walks:[`Refund.refunds`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT a.merchant_id,                                                 -- Authorization.at_merchant
       COUNT(*) AS quick_refunds, SUM(r.amount) AS refunded
FROM fct_refund r
JOIN fct_capture c ON c.capture_id = r.capture_id                     -- Refund.refunds

WHERE DATEDIFF('minute', c.captured_at, r.refunded_at) <= 60
  AND r.refunded_at >= DATEADD('day', -30, CURRENT_DATE)
GROUP BY 1

`},{id:`CQ-78`,domain:`settlement`,question:`How much was captured each day this month, by merchant category code?`,walks:[`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT DATE_TRUNC('day', c.captured_at) AS day, m.mcc, c.currency, SUM(c.amount) AS captured
FROM fct_capture c
JOIN fct_authorization a ON a.authorization_id = c.authorization_id   -- Capture.captures
JOIN dim_merchant m ON m.merchant_id = a.merchant_id                  -- Authorization.at_merchant
WHERE c.captured_at >= DATE_TRUNC('month', CURRENT_DATE)

ORDER BY 1, captured DESC

`},{id:`CQ-79`,domain:`settlement`,question:`Which refunds went back on authorizations that were later reported as fraud?`,walks:[`Refund.refunds`,`Capture.captures`,`FraudReport.reports`],answered_in:`neptune`,query:`MATCH (rf:Refund)-[:REFUNDS]->(:Capture)-[:CAPTURES]->(a:Authorization)<-[:REPORTS]-(fr:FraudReport)
RETURN rf.id AS refund, rf.refunded_at AS refunded_at, a.id AS authorization,
       fr.id AS fraud_report, fr.reported_at AS reported_at
LIMIT 100
`},{id:`CQ-80`,domain:`settlement`,question:`What share of each issuer's settled amount came back as chargebacks last quarter?`,walks:[`Settlement.settles`,`Capture.captures`,`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`,`Chargeback.disputes`],answered_in:`snowflake`,query:`SELECT b.issuer_id,                                                   -- BinRange.assigned_to
       SUM(c.amount) AS settled,
       SUM(IFF(cb.chargeback_id IS NOT NULL, c.amount, 0)) AS charged_back,
       charged_back / NULLIF(settled, 0) AS chargeback_share
FROM fct_settlement_item s
JOIN fct_capture c ON c.capture_id = s.capture_id                     -- Settlement.settles
JOIN fct_authorization a ON a.authorization_id = c.authorization_id   -- Capture.captures
JOIN dim_card card ON card.card_id = a.card_id                        -- Authorization.with_card
JOIN dim_bin_range b ON b.bin_id = card.bin_id                        -- Card.in_bin_range
LEFT JOIN fct_chargeback cb ON cb.capture_id = c.capture_id           -- Chargeback.disputes
WHERE s.settled_at >= DATEADD('quarter', -1, DATE_TRUNC('quarter', CURRENT_DATE))
  AND s.settled_at < DATE_TRUNC('quarter', CURRENT_DATE)
GROUP BY 1
ORDER BY chargeback_share DESC
LIMIT 50;
`},{id:`CQ-81`,domain:`settlement`,question:`Which captures took more than five days to settle this month?`,walks:[`Settlement.settles`],answered_in:`snowflake`,query:`SELECT c.capture_id, c.captured_at, s.settled_at,
       DATEDIFF('day', c.captured_at, s.settled_at) AS days
FROM fct_settlement_item s
JOIN fct_capture c ON c.capture_id = s.capture_id     -- Settlement.settles
WHERE s.settled_at >= DATE_TRUNC('month', CURRENT_DATE)
  AND DATEDIFF('day', c.captured_at, s.settled_at) > 5
ORDER BY days DESC
LIMIT 100;
`},{id:`CQ-82`,domain:`settlement`,question:`Which merchants captured in a different currency from the one they authorized in?`,walks:[`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT a.merchant_id, a.currency AS authorized_in, c.currency AS captured_in,   -- Authorization.at_merchant

`},{id:`CQ-83`,domain:`settlement`,question:`Which merchants' captures did this settlement pay out, and how much each?`,walks:[`Settlement.settles`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT a.merchant_id, c.currency, COUNT(*) AS captures, SUM(c.amount) AS paid   -- Authorization.at_merchant

`},{id:`CQ-84`,domain:`settlement`,question:`What interchange did each capture pay?`,walks:[`Capture.qualifies_for`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT c.capture_id, p.network, p.code AS program, p.name,

`},{id:`CQ-85`,domain:`settlement`,question:`Which settlement file or batch carried this capture?`,walks:[`Capture.in_batch`,`Settlement.settles`],answered_in:`snowflake`,query:`SELECT c.capture_id, b.batch_id, b.sent_at, s.settlement_id, s.settled_at

`},{id:`CQ-86`,domain:`settlement`,question:`What exchange rate converted this capture into the settlement currency?`,walks:[`Settlement.settles`],answered_in:`snowflake`,query:`SELECT c.capture_id, c.amount, c.currency, c.conversion_rate,

`},{id:`CQ-87`,domain:`settlement`,question:`When was this merchant paid for yesterday's captures?`,walks:[`Capture.captures`,`Authorization.at_merchant`,`Payout.funds`],answered_in:`snowflake`,query:`SELECT p.payout_id, p.paid_at, p.amount, p.currency, p.reserve_amount,

`},{id:`CQ-88`,domain:`settlement`,question:`Which captures were adjusted after they settled?`,walks:[`Adjustment.adjusts`,`Settlement.settles`],answered_in:`snowflake`,query:`SELECT c.capture_id, c.amount AS captured, adj.amount AS adjustment,

`},{id:`CQ-89`,domain:`settlement`,question:`What reserve is the acquirer holding back for this merchant?`,walks:[`Payout.funds`,`Capture.captures`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`SELECT p.currency, SUM(p.reserve_amount) AS reserve_held

`},{id:`CQ-90`,domain:`settlement`,question:`Which settlements didn't reconcile with the network's totals?`,walks:[`Reconciliation.reconciles`],answered_in:`snowflake`,query:`SELECT s.settlement_id, s.settled_at, s.amount, s.currency,

`},{id:`CQ-91`,domain:`settlement`,question:`What fees did the network collect from this acquirer last month?`,walks:[`FeeCollection.collected_from`,`FeeCollection.under`],answered_in:`snowflake`,query:`SELECT p.network, p.code AS program, p.name, f.currency,

`},{id:`CQ-06`,domain:`risk`,question:`Which merchants share devices or acquirers with a flagged one?`,walks:[`FraudReport.reports`,`Authorization.at_merchant`,`Device.seen_at`,`Merchant.acquired_by`],answered_in:`neptune`,query:`MATCH (:FraudReport)-[:REPORTS]->(:Authorization)-[:AT_MERCHANT]->(flagged:Merchant {id: $merchant})

`},{id:`CQ-92`,domain:`risk`,question:`Which devices seen at this merchant were also seen at merchants with fraud reports?`,walks:[`Device.seen_at`,`FraudReport.reports`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (:Merchant {id: $merchant})<-[:SEEN_AT]-(d:Device)-[:SEEN_AT]->(other:Merchant)

`},{id:`CQ-93`,domain:`risk`,question:`Which cards used on this device were reported as fraud?`,walks:[`Authorization.from_device`,`Authorization.with_card`,`FraudReport.reports`],answered_in:`neptune`,query:`MATCH (a:Authorization)-[:FROM_DEVICE]->(:Device {id: $device})

`},{id:`CQ-94`,domain:`risk`,question:`Which merchants share an acquirer and at least two devices with this flagged merchant?`,walks:[`Merchant.acquired_by`,`Device.seen_at`],answered_in:`neptune`,query:`MATCH (flagged:Merchant {id: $merchant})-[:ACQUIRED_BY]->(:Acquirer)<-[:ACQUIRED_BY]-(other:Merchant)

`},{id:`CQ-95`,domain:`risk`,question:`Which BIN ranges had the most fraud reports this month?`,walks:[`FraudReport.reports`,`Authorization.with_card`,`Card.in_bin_range`],answered_in:`neptune`,query:`MATCH (fr:FraudReport)-[:REPORTS]->(:Authorization)-[:WITH_CARD]->(:Card)-[:IN_BIN_RANGE]->(b:BinRange)

`},{id:`CQ-96`,domain:`risk`,question:`Which issuers report fraud on this merchant's transactions, and how often?`,walks:[`FraudReport.reports`,`Authorization.at_merchant`,`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`],answered_in:`neptune`,query:`MATCH (fr:FraudReport)-[:REPORTS]->(a:Authorization)-[:AT_MERCHANT]->(:Merchant {id: $merchant})

`},{id:`CQ-97`,domain:`risk`,question:`Which cardholders have fraud reports at more than three merchants?`,walks:[`FraudReport.reports`,`Authorization.with_card`,`Card.held_by`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (:FraudReport)-[:REPORTS]->(a:Authorization)-[:WITH_CARD]->(:Card)-[:HELD_BY]->(ch:Cardholder)

`},{id:`CQ-98`,domain:`risk`,question:`Which devices first appeared at this merchant this week and were already seen at five or more other merchants?`,walks:[`Device.seen_at`],answered_in:`neptune`,query:`MATCH (d:Device)-[s:SEEN_AT]->(here:Merchant {id: $merchant})

`},{id:`CQ-99`,domain:`risk`,question:`Which merchants are the common point of purchase for cards reported as fraud this month?`,walks:[`FraudReport.reports`,`Authorization.with_card`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`WITH reported AS (
  SELECT a.card_id, MIN(f.reported_at) AS first_report              -- Authorization.with_card

`},{id:`CQ-100`,domain:`risk`,question:`What is this merchant's VAMP-style ratio this month, fraud reports plus disputes over settled transactions?`,walks:[`FraudReport.reports`,`Chargeback.disputes`,`Capture.captures`,`Authorization.at_merchant`,`Settlement.settles`],answered_in:`snowflake`,query:`WITH frauds AS (
  SELECT COUNT(*) AS n
  FROM fct_fraud_report f
  JOIN fct_authorization a ON a.authorization_id = f.authorization_id -- FraudReport.reports
  WHERE a.merchant_id = :merchant_id                                  -- Authorization.at_merchant
    AND f.reported_at >= DATE_TRUNC('month', CURRENT_DATE)
),
disputes AS (
  SELECT COUNT(*) AS n
  FROM fct_chargeback cb
  JOIN fct_capture c ON c.capture_id = cb.capture_id                  -- Chargeback.disputes
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE a.merchant_id = :merchant_id                                  -- Authorization.at_merchant
    AND cb.opened_at >= DATE_TRUNC('month', CURRENT_DATE)
),
settled AS (
  SELECT COUNT(DISTINCT s.capture_id) AS n
  FROM fct_settlement_item s
  JOIN fct_capture c ON c.capture_id = s.capture_id                   -- Settlement.settles
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE a.merchant_id = :merchant_id                                  -- Authorization.at_merchant
    AND s.settled_at >= DATE_TRUNC('month', CURRENT_DATE)
)
SELECT frauds.n AS fraud_reports, disputes.n AS disputes, settled.n AS settled_transactions,
       (frauds.n + disputes.n) / NULLIF(settled.n, 0) AS ratio

LIMIT 1;
`},{id:`CQ-101`,domain:`risk`,question:`Which merchants' fraud reports this week jumped against their eight-week average?`,walks:[`FraudReport.reports`,`Authorization.at_merchant`],answered_in:`snowflake`,query:`WITH weekly AS (
  SELECT a.merchant_id,                                               -- Authorization.at_merchant
         DATE_TRUNC('week', f.reported_at) AS week, COUNT(*) AS reports
  FROM fct_fraud_report f
  JOIN fct_authorization a ON a.authorization_id = f.authorization_id -- FraudReport.reports
  WHERE f.reported_at >= DATEADD('week', -8, DATE_TRUNC('week', CURRENT_DATE))
  GROUP BY 1, 2
)
SELECT merchant_id,
       SUM(IFF(week = DATE_TRUNC('week', CURRENT_DATE), reports, 0)) AS this_week,
       SUM(IFF(week < DATE_TRUNC('week', CURRENT_DATE), reports, 0)) / 8 AS weekly_average

HAVING this_week > 3 * weekly_average

LIMIT 50;
`},{id:`CQ-102`,domain:`risk`,question:`Which devices tried more than five different cards within an hour yesterday?`,walks:[`Authorization.from_device`,`Authorization.with_card`],answered_in:`snowflake`,query:`SELECT a.device_id,                                         -- Authorization.from_device
       DATE_TRUNC('hour', a.authorized_at) AS hour,
