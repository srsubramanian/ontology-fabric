# Every check a contributor runs locally (README), on every push.
name: Checks

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements*.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install tools
        run: |
          pip install -r tools/requirements.txt -r tools/requirements-ontology.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix web

      - name: Lint the ontology
        run: linkml-lint --config ontology/.linkmllint.yaml ontology/payments.yaml

      - name: Check the ontology, and the explorer's reading of it
        run: python tools/check_ontology.py

      - name: Both checkers name each planted mistake, and agree
        run: python tools/test_checks.py

      - name: Generated artifacts match the ontology
        run: python tools/generate.py --check

      - name: Typecheck and build the pages
        run: npm run check --prefix web

      - name: Built pages match their source
        run: |
          if ! git diff --exit-code --stat -- site/; then
            echo "::error::site/ is out of date. Run 'npm run check' in web/ and commit the rebuilt pages."
            exit 1
          fi

      - name: Smoke test, light, dark and phone
        run: python tools/smoke_test.py

      - name: The studio's whole flow, against a stand-in runtime
        run: python tools/test_studio.py

      - name: The lineage deep scan rewrites the illustrative versions from the made-up repositories
        run: python tools/test_lineage_scan.py

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
