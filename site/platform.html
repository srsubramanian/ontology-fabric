rock:4,agents:5,analysts:5,partners:5},La={design:1,ingest:2,sync:3,query:4},Ra={design:{name:`Design time`,color:`var(--onto)`,steps:[{title:`Change the ontology`,nodes:[`ontsrc`,`gen`],hops:[[`d1`]],text:`A domain owner merges a pull request to the LinkML source. CI regenerates the OWL, the SHACL shapes and every other artifact, and checks sample data against the shapes; a failing check stops the release before anything reaches a store.`},{title:`Generate every schema from one source`,nodes:[`gen`,`neptune`,`extract`,`opensearch`],hops:[[`d4`,`d5`,`d6`]],text:`The generator emits Neptune label chains and bulk-loader CSV headers, the schema the LLM must extract against, and the OpenSearch index mappings plus the ontology index. Both stores get their schema from the same build, so they cannot drift apart.`},{title:`Publish the release`,nodes:[`gen`,`pub`,`partners`],hops:[[`d2`],[`d3`]],text:`The release goes out at versioned IRIs as Turtle, JSON-LD and readable docs. Other teams pin a version and use the same definitions your graph uses, which is what makes the ontology a product rather than an internal schema.`}]},ingest:{name:`Ingest`,color:`var(--graph)`,steps:[{title:`Collect sources`,nodes:[`repos`,`events`,`docs`,`extract`],hops:[[`i1`,`i2`,`i3`]],text:`Code is parsed with tree-sitter: entities, enums, state machines, OpenAPI and Avro. Payment events are mapped deterministically, with no LLM involved. Documents are split into chunks.`},{title:`Extract with Claude`,nodes:[`extract`,`bedrock`],hops:[[`i4`],[`-i4`]],text:`For code and documents, Claude on Bedrock extracts entities and relationships constrained to the generated schema, and the embedding model embeds each chunk. Low-confidence results wait for human review, in a durable function that survives restarts.`},{title:`Write the graph`,nodes:[`extract`,`stage`,`neptune`],hops:[[`i8`,`i5`],[`i6`]],text:`Everyday writes use openCypher MERGE on deterministic IDs, so a rerun never duplicates anything. First loads and backfills go through S3 and the Neptune bulk loader.`},{title:`Store chunk text in OpenSearch`,nodes:[`extract`,`opensearch`,`neptune`],hops:[[`i7`]],text:`Chunk text and vectors go to the chunks index. Neptune gets only a small :Chunk node with MENTIONS edges to the entities it names, so any answer traces back to its source without storing text twice.`},{title:`Propose ontology changes`,nodes:[`extract`,`ontsrc`],hops:[[`i9`]],text:`When code shows something the ontology lacks, such as a new dispute state or enum value, the pipeline opens a pull request against the LinkML source. A person accepts it; the ontology never changes on its own.`}]},sync:{name:`Sync`,color:`var(--search)`,steps:[{title:`Capture the change`,nodes:[`neptune`,`poller`],hops:[[`y1`]],text:`Every committed write to Neptune appears on Neptune Streams in commit order. The poller resumes from the last stream position it checkpointed.`},{title:`Build the search document`,nodes:[`poller`,`bedrock`],hops:[[`y2`],[`-y2`]],text:`For each changed entity, the poller reads its label chain, names, aliases and codes, writes a short summary, and embeds it with the same model used for chunks.`},{title:`Upsert into OpenSearch`,nodes:[`poller`,`opensearch`],hops:[[`y3`]],text:`The document is upserted into the entities index with neptune_id as its _id. The index is derived data: if it is lost or corrupted, rebuild it from Neptune.`}]},query:{name:`Query`,color:`var(--query)`,steps:[{title:`Ask`,nodes:[`agents`,`api`],hops:[[`q1`]],text:`An agent calls a retrieval tool over MCP. For example: which merchants had the most 10.4 chargebacks last month, and what do the network rules say about 10.4?`},{title:`Find entry points in OpenSearch`,nodes:[`api`,`opensearch`],hops:[[`q3`],[`-q3`]],text:`Hybrid search, keyword plus vector, over the entities and chunks indexes. It returns Neptune IDs and chunk IDs rather than answers. Misspelled merchant names and bare codes resolve here.`},{title:`Write and check the Cypher`,nodes:[`api`,`opensearch`,`bedrock`],hops:[[`q3`],[`-q3`],[`q5`],[`-q5`]],text:`For counts and rankings, the service fetches the relevant classes from the ontology index, has Claude write a parameterized query, and validates it against the ontology before it runs.`},{title:`Traverse in Neptune`,nodes:[`api`,`neptune`],hops:[[`q4`],[`-q4`]],text:`The query runs on a Neptune reader, starting from the IDs found in OpenSearch. openCypher cannot call OpenSearch from inside a query, so the service does the join, by ID.`},{title:`Answer with citations`,nodes:[`api`,`bedrock`,`agents`],hops:[[`q5`],[`-q5`],[`-q1`]],text:`Claude writes the answer from the subgraph and the retrieved chunks only, citing node IDs and chunk IDs. Every sentence traces to a Cypher run or a source document.`}]}},za={ontsrc:{title:`Ontology source`,what:`The product itself: payment classes, relationship types, properties and rules in LinkML, from which the OWL and the SHACL shapes that define valid data are generated. People write and approve it; the extraction pipeline only proposes changes as pull requests.`,holds:[`Class hierarchy, such as Chargeback under DisputeEvent under PaymentEvent`,`Allowed relationships and their direction`,`Property types and code lists`,`Mappings back to ISO 8583 data elements`],watch:`Treat renamed or removed classes as major versions. Every consumer, including your own indexes, pins a version.`},gen:{title:`Schema generator`,holdsLabel:`Outputs`,what:`A CI job, rdflib plus templates, that turns the ontology into every schema the runtime needs, so nobody writes a schema by hand twice.`,holds:[`Neptune label chains and bulk-loader CSV headers with types`,`Pydantic models for pipeline validation`,`Allowed nodes and relationships for LLM extraction`,`OpenSearch mappings and ontology index documents`,`The ontology meta-graph load for Neptune`],watch:`Fail the build if any generated file differs from what is committed. Hand edits are how the two stores drift apart.`},pub:{title:`Published ontology`,what:`Each release at stable, versioned IRIs, served from S3 behind CloudFront as Turtle, JSON-LD and readable HTML.`,holds:[`Release notes and changelog`,`A page per class with definition and examples`,`Downloadable SHACL shapes`],watch:`Never overwrite a published version. Fix forward with a patch release.`},repos:{title:`Code repositories`,what:`Bitbucket repositories parsed with tree-sitter to see how payments are modeled in running code.`,holds:[`JPA entities and enums`,`State machines for dispute and settlement flows`,`OpenAPI specs and Avro schemas`],watch:`Code tells you what exists, not what it means. Its findings reach the ontology only as reviewed pull requests.`},events:{title:`Payment events`,what:`Authorization, capture, settlement, refund and chargeback events from the processing platform, mapped without an LLM.`,holds:[`Named properties such as pos_entry_mode and response_code, not raw DE keys`,`A mapping table back to ISO 8583 data elements and subfields`],watch:`Tokens only. No PANs in either store, including inside chunk text.`},docs:{title:`Documents`,what:`Network rules, reason code guides, dispute runbooks and internal specs.`,holds:[`Chunks that keep their section headings`,`Links from each chunk to the entities it mentions`],watch:`Set an access classification on every chunk at ingest. Adding it later means re-reading every document.`},extract:{title:`Extraction pipeline`,holdsLabel:`Two jobs`,what:`Lambda durable functions: fan-out per source batch, steps that are checkpointed and retried, and a callback wait for human review of low-confidence results. Claude's mapping can run in LangGraph inside a step. Open-ended work on one repository, with the Claude Agent SDK, runs as a Fargate task the function waits on.`,holds:[`Main job: fill Neptune and OpenSearch with data validated against the generated schema`,`Side job: open a pull request when code shows something the ontology lacks`,`Never writes the ontology itself`],watch:`Make every write idempotent with deterministic IDs, so a retry or a rerun changes nothing.`},stage:{title:`Staging bucket`,what:`S3 staging for the Neptune bulk loader, in the openCypher CSV format with :ID, :LABEL, :START_ID, :END_ID, :TYPE and typed property columns.`,holds:[`First loads and backfills`,`A record of exactly what each release loaded`],watch:`Type codes such as MCC and response code as String, or leading zeros disappear.`},neptune:{title:`Neptune Database`,what:`The system of record for payment facts: every entity, event and relationship, queried with openCypher.`,holds:[`Entities and lifecycle events with deterministic IDs`,`Relationships with direction, per the ontology`,`The ontology as a small meta-graph`,`Chunk stubs with MENTIONS edges for provenance`,`ontology_version and source on every node`],keep:[`Long text`,`Embeddings`,`PANs`],watch:`Neptune enforces no schema, so the pipeline is the only enforcement. Turn on IAM authentication and Streams from the first day.`},poller:{title:`Stream poller`,holdsLabel:`Inside`,what:`A Lambda function that reads Neptune Streams and keeps the entities index current. Start from the AWS Neptune-to-OpenSearch replication stack and change its poller to write your document shape.`,holds:[`A checkpoint of the last stream position`,`The entity summary builder`,`The embedding call`],watch:`Alarm on replication lag. If the poller falls behind the stream retention window, rebuild the index from Neptune rather than catching up.`},opensearch:{title:`OpenSearch`,what:`The way into the graph. Three indexes, each derived from Neptune or from source documents, never the other way round.`,holds:[`entities: names, aliases, codes, labels, summary, vector`,`chunks: document text, vector, mentioned Neptune IDs`,`ontology: definitions used to write Cypher`],keep:[`Relationships as the source of truth`,`Anything you could not rebuild`],watch:`Put codes such as MCCs, reason codes and BINs in keyword fields. Analyzed text fields split them apart.`},bedrock:{title:`Amazon Bedrock`,what:`Claude for extraction, Cypher generation and answers, plus one embedding model for entities, chunks and ontology definitions.`,holds:[`Extraction prompts built from the generated schema`,`The pinned embedding model ID`],watch:`Changing the embedding model means rebuilding all three indexes. Plan it like an ontology major version.`},api:{title:`Retrieval service`,holdsLabel:`Inside`,what:`A LangGraph service that decides how to answer each question: lookups start in OpenSearch, relationship questions expand in Neptune, and counts or rankings go through validated text-to-Cypher.`,holds:[`The router`,`A Cypher validator built from the ontology`,`One access policy applied to results from both stores`],watch:`openCypher on Neptune cannot call OpenSearch from inside a query, so this service does the join, by ID.`},agents:{title:`Agents`,holdsLabel:`Tools`,what:`Agents reach retrieval through MCP tools behind AgentCore Gateway, never through direct database access. Other teams’ agents can hand them work over A2A.`,holds:[`search_entities`,`expand_subgraph`,`run_validated_cypher`,`get_ontology_class`],watch:`Do not expose a raw Cypher tool. Agents get validated, read-only, bounded queries.`},analysts:{title:`Analyst UI`,what:`A search box backed by OpenSearch and a graph explorer backed by Neptune. Every node links to its ontology definition.`,holds:[`Saved queries for common lineage questions`],watch:`Route it through the retrieval service so the same access policy applies as for agents.`},partners:{title:`Other teams and partners`,what:`Business units and partners consume ontology releases as the shared definition of payment concepts.`,holds:[`A pinned ontology version`,`Their own mappings to your classes`],watch:`Announce deprecations one release ahead, as you would for an API.`}},Ba=[{n:1,title:`Design the ontology`,short:`Ontology`,c:`var(--onto)`,nodes:[`ontsrc`,`gen`,`pub`]},{n:2,title:`Fill t #
# It writes down what site/platform.html and site/retrieval.html already show:
# the running examples, the relationship names in their Cypher, the modeling
# patterns from chapter 1 (events not status fields, codes as nodes, one
# direction, a shallow hierarchy, roles), and the classes that chapter's
# competency-question rounds added. The real core, prototype step 1,
# replaces it, bootstrapped from ISO 20022 and FIBO (decision 9).
#
# Annotations used on classes, read by the class explorer (web/src/explorer):
#   owner     the team that owns the class (decision 9: layered ownership)
#   lives_in  where instances live: graph (Neptune), warehouse (lake or
#             Snowflake, joining the graph when a question walks through it)
#             or search (text in OpenSearch, a stub in Neptune) - decision 2
#   id_rule   the one ID used in every store (decision 4)
#   example   an instance from the pages' running examples, where one exists
#
# Check it with: linkml-lint --config ontology/.linkmllint.yaml ontology/payments.yaml

id: https://ontology.example.com/payments
name: payments
title: Payments ontology (illustrative draft)
version: 1.6.0
prefixes:
  pay: https://ontology.example.com/payments/
  linkml: https://w3id.org/linkml/
  # Standards we align with through skos:closeMatch, never owl:imports (decision 9).
  # Checked 2026-09-30 against OMG Commons 20250801 and FIBO master.
  cmns-pts: https://www.omg.org/spec/Commons/PartiesAndSituations/
  cmns-org: https://www.omg.org/spec/Commons/Organizations/
  fibo-fnd-aap-ppl: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/
default_prefix: pay
default_range: string
imports:
  - linkml:types

classes:

  # ---------- Parties and the roles they play ----------

  Party:
    abstract: true
    description: A person or organization that takes part in payments.
    close_mappings: [cmns-pts:Party]
    slots: [id, name, acts_as]
    annotations:
      owner: core
      lives_in: graph

  Person:
    is_a: Party
    description: An individual, such as a cardholder.
    close_mappings: [fibo-fnd-aap-ppl:Person]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "person:{person_id}"
      example: "Maya"

  Organization:
    is_a: Party
    description: >-
      A company or institution. One bank is one Organization, however many
      roles it plays.
    close_mappings: [cmns-org:Organization]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "org:{org_id}"
      example: "First Bay Bank"

  PartyRole:
    abstract: true
    description: >-
      A role a party plays, such as issuer or merchant. Roles keep one bank
      from turning into two nodes.
    close_mappings: [cmns-pts:PartyRole]
    slots: [id]
    annotations:
      owner: core
      lives_in: graph

  Cardholder:
    is_a: PartyRole
    description: The person a card is issued to.
    annotations:
      owner: core
      lives_in: graph
      id_rule: "ch:{cardholder_id}"
      example: "Maya"

  Issuer:
    is_a: PartyRole
    description: The bank that issues cards and approves or declines their authorizations.
    annotations:
      owner: core
      lives_in: graph
      id_rule: "iss:{issuer_id}"
      example: "First Bay Bank"

  Acquirer:
    is_a: PartyRole
    description: The bank that signs up merchants and claims funds for them.
    annotations:
      owner: core
      lives_in: graph
      id_rule: "acq:{acquirer_id}"
      example: "Coastal Acquiring"

  Merchant:
    is_a: PartyRole
    description: A business that accepts cards, as its acquirer knows it.
    aliases: [store, merchant outlet]
    slots: [name, mcc, acquired_by]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "m:{merchant_id}"
      example: "m:88213, Harbor Grill #4, MCC 5812"

  # ---------- Instruments ----------

  Card:
    description: A payment card, identified by a token rather than its number.
    aliases: [PAN, token]
    slots: [id, network, held_by, in_bin_range]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "card:{token}"
      example: "card:tk_1a3"

  BinRange:
    description: >-
      The range of card numbers a bank issues from. A node rather than a
      string, so authorizations can be grouped by it.
    aliases: [BIN, IIN]
    slots: [id, prefix, assigned_to]
    annotations:
      owner: authorization
      lives_in: graph
      id_rule: "bin:{prefix}"

  Device:
    description: A phone, browser or terminal an authorization came from.
    slots: [id, seen_at]
    annotations:
      owner: risk
      lives_in: graph
      id_rule: "dev:{device_id}"

  # ---------- Events in a payment's life ----------

  PaymentEvent:
    abstract: true
    description: >-
      Something that happened to a payment, at a time. Each step is its own
      event, instead of a status field that keeps being overwritten.
    slots: [id]
    annotations:
      owner: core
      lives_in: graph

  Authorization:
    is_a: PaymentEvent
    description: The issuer's approval or decline of a payment request.
    aliases: [auth, approval]
    slots: [authorized_at, amount, channel, at_merchant, with_card, from_device, has_response]
    slot_usage:
      at_merchant:
        required: true
      with_card:
        required: true
      has_response:
        required: true
    annotations:
      owner: authorization
      lives_in: warehouse
      id_rule: "auth:{authorization_id}"
      example: "auth:5521, Aug 3, $42.50, card not present"

  Capture:
    is_a: PaymentEvent
    description: The merchant claiming the funds an authorization approved.
    aliases: [clearing, presentment]
    slots: [captured_at, amount, captures]
    slot_usage:
      captures:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "cap:{capture_id}"
      example: "cap:7731, Aug 4, $42.50"

  Settlement:
    is_a: PaymentEvent
    description: Funds moving between the banks for a batch of captures.
    slots: [settled_at, settles]
    slot_usage:
      settles:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "stl:{settlement_id}"

  Refund:
    is_a: PaymentEvent
    description: The merchant returning all or part of a captured amount.
    aliases: [credit]
    slots: [refunded_at, amount, refunds]
    slot_usage:
      refunds:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "rf:{refund_id}"

  FraudReport:
    is_a: PaymentEvent
    description: An issuer reporting an authorization as fraud to the network.
    aliases: [TC40, SAFE report]
    slots: [reported_at, reports]
    slot_usage:
      reports:
        required: true
    annotations:
      owner: risk
      lives_in: graph
      id_rule: "fr:{report_id}"

  DisputeEvent:
    is_a: PaymentEvent
    abstract: true
    description: A step in a dispute over a captured transaction.
    slots: [opened_at, disputes, has_reason, responds_to]
    annotations:
      owner: disputes
      lives_in: graph

  Chargeback:
    is_a: DisputeEvent
    title: Chargeback
    aliases: [CB, chargeback case]
    description: >-
      A dispute event in which the issuer, through the card network,
      reverses all or part of a captured transaction for the cardholder.
    slot_usage:
      disputes:
        required: true
      has_reason:
        required: true
      opened_at:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "cb:{chargeback_id}"
      example: "cb:1001, Aug 19, reason 10.4"

  Representment:
    is_a: DisputeEvent
    description: The merchant's response to a chargeback, with its evidence.
    aliases: [second presentment, merchant response]
    slots: [has_evidence]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rep:{representment_id}"

  PreArbitration:
    is_a: DisputeEvent
    description: Issuer challenges the merchant's response before arbitration.
    aliases: [pre-arb]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "parb:{pre_arbitration_id}"

  # ---------- Codes and documents ----------

  ReasonCode:
    description: >-
      A network's reason for a dispute. A node, so chargebacks and the
      documents that explain the code meet at one place.
    aliases: [dispute reason]
    slots: [id, network, code]
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rc:{network}:{code}"
      example: "rc:visa:10.4, Other Fraud: Card-Absent Environment"
      code_list: VisaReasonCode

  ResponseCode:
    description: The issuer's answer code on an authorization, such as approved or declined.
    slots: [id, code]
    annotations:
      owner: authorization
      lives_in: graph
      id_rule: "resp:{code}"

  Document:
    description: >-
      A network rule book, runbook or piece of evidence. Its text lives in
      search; Neptune keeps a stub.
    slots: [id, name, kind]
    annotations:
      owner: core
      lives_in: search
      id_rule: "{doc_slug}"
      example: "visa-vamp-2026"

  Chunk:
    description: >-
      A passage of a document. Its text and embedding live in OpenSearch; the
      stub in Neptune links it to the entities it mentions.
    slots: [id, part_of, mentions]
    annotations:
      owner: core
      lives_in: search
      id_rule: "{doc_slug}#{chunk}"
      example: "visa-vamp-2026#c04"

  # ---------- Open ranges ----------

  Any:
    class_uri: linkml:Any
    description: >-
      Any entity with an ID. A relationship whose range is Any can point at a
      node of any class, as a chunk's MENTIONS does. Not a node itself.

slots:

  # ---------- Attributes ----------

  id:
    identifier: true
    description: The one ID used in Neptune, OpenSearch and Snowflake.
  name:
    description: What people call it.
  mcc:
    description: Merchant category code.
    pattern: "^\\\\d{4}$"
  network:
    description: The card network whose rules apply.
    range: CardNetwork
  code:
    description: The code as the network or issuer writes it.
  prefix:
    description: The leading digits every card in the range shares.
  kind:
    description: What sort of document it is.
    range: DocumentKind
  amount:
    description: The amount, in the transaction currency.
    range: decimal
  channel:
    description: Whether the card was present.
    range: Channel
  authorized_at:
    description: When the issuer answered.
    range: datetime
  captured_at:
    description: When the merchant claimed the funds.
    range: datetime
  settled_at:
    description: When the funds moved.
    range: datetime
  refunded_at:
    description: When the refund was made.
    range: datetime
  reported_at:
    description: When the fraud was reported.
    range: datetime
  opened_at:
    description: When the dispute step began.
    range: datetime

  # ---------- Relationships: one canonical direction each ----------

  acts_as:
    description: A party plays a role.
    range: PartyRole
    multivalued: true
  acquired_by:
    description: A merchant's acquiring bank.
    range: Acquirer
  held_by:
    description: Who a card is issued to.
    range: Cardholder
  in_bin_range:
    description: The BIN range a card's number falls in.
    range: BinRange
  assigned_to:
    description: The issuer a BIN range belongs to.
    range: Issuer
  at_merchant:
    description: Where an authorization was requested.
    range: Merchant
  with_card:
    description: The card an authorization used.
    range: Card
  from_device:
    description: The device an authorization came from.
    range: Device
  seen_at:
    description: >-
      A summary edge, rebuilt daily from Snowflake: the device made
      authorizations at the merchant. It carries auths, first_seen and
      last_seen, so risk walks don't need every authorization in the graph
      (decision 2).
    range: Merchant
    multivalued: true
  has_response:
    description: The issuer's answer to an authorization.
    range: ResponseCode
  captures:
    description: The authorization a capture claims funds for.
    range: Authorization
  settles:
    description: The captures a settlement pays out.
    range: Capture
    multivalued: true
  refunds:
    description: The capture a refund returns money from.
    range: Capture
  disputes:
    description: Links a dispute event to the capture it contests.
    range: Capture
  has_reason:
    description: The network reason codes behind a dispute.
    range: ReasonCode
    multivalued: true
  responds_to:
    description: The earlier dispute event this one answers.
    range: DisputeEvent
  has_evidence:
    description: Documents sent as evidence.
    range: Document
    multivalued: true
  reports:
    description: The authorization a fraud report is about.
    range: Authorization
  part_of:
    description: The document a chunk comes from.
    range: Document
  mentions:
    description: >-
      Anything a chunk names, such as a merchant, a reason code or a dispute,
      so its text links to the graph.
    range: Any
    multivalued: true

enums:

  CardNetwork:
    description: Card networks whose rules the ontology covers.
    permissible_values:
      visa:
      mastercard:

  Channel:
    description: How the card took part in a payment.
    permissible_values:
      card_present:
      card_not_present:

  DocumentKind:
    description: Kinds of document the platform indexes.
    permissible_values:
      network_rules:
      runbook:
      evidence:

  VisaReasonCode:
    description: Visa dispute reason codes. Each is loaded as a ReasonCode node.
    permissible_values:
      "10.4":
        description: "Other Fraud: Card-Absent Environment"
        meaning: pay:visa-10.4
      "13.1":
        description: "Merchandise/Services Not Received"
