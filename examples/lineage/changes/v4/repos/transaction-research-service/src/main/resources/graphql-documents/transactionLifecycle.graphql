# What the backend asks the transaction data API for (made up).
query transactionLifecycle($id: ID!) {
  transaction(id: $id) {
    transactionId
    authorizedAt
    amountAuthorized
    currencyCode
    responseCode
    card { last4 network }
    merchant { name categoryCode riskTier }
    deviceId
    settlementDate
    lifecycle { kind id at }
    captures { id amount }
    refunds { id amount }
    chargebacks { id reasonCode respondBy }
  }
}
