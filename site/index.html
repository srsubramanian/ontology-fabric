LIMIT 100;
`},{id:`CQ-103`,domain:`risk`,question:`Which merchants had a burst of small card-not-present declines in the last day, a sign of card testing?`,walks:[`Authorization.at_merchant`,`Authorization.has_response`],answered_in:`snowflake`,query:`SELECT a.merchant_id,                                       -- Authorization.at_merchant

HAVING COUNT(*) >= 50

`},{id:`CQ-104`,domain:`risk`,question:`Which acquirers had the highest fraud-report rate across their merchants this quarter?`,walks:[`FraudReport.reports`,`Authorization.at_merchant`,`Merchant.acquired_by`],answered_in:`snowflake`,query:`SELECT m.acquirer_id,                                                 -- Merchant.acquired_by

`},{id:`CQ-105`,domain:`risk`,question:`Which organizations act as more than one merchant, and do any of those merchants have fraud reports?`,walks:[`Organization.acts_as`,`FraudReport.reports`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (o:Organization)-[:ACTS_AS]->(m:Merchant)

`},{id:`CQ-106`,domain:`risk`,question:`Which documents mention this merchant, such as case notes or network rulings?`,walks:[`Chunk.mentions`,`Chunk.part_of`],answered_in:`neptune`,query:`MATCH (k:Chunk)-[:MENTIONS]->(:Merchant {id: $merchant})

`},{id:`CQ-107`,domain:`risk`,question:`Which fraud-reported authorizations came from a device another cardholder also used?`,walks:[`FraudReport.reports`,`Authorization.from_device`,`Authorization.with_card`,`Card.held_by`],answered_in:`neptune`,query:`MATCH (:FraudReport)-[:REPORTS]->(a:Authorization)-[:FROM_DEVICE]->(d:Device)

`},{id:`CQ-108`,domain:`risk`,question:`How many days pass between a fraudulent authorization and its fraud report, by issuer, this quarter?`,walks:[`FraudReport.reports`,`Authorization.with_card`,`Card.in_bin_range`,`BinRange.assigned_to`],answered_in:`snowflake`,query:`SELECT b.issuer_id,                                                   -- BinRange.assigned_to

`},{id:`CQ-109`,domain:`risk`,question:`Which cards from this BIN range were reported as fraud at the same merchant?`,walks:[`Card.in_bin_range`,`Authorization.with_card`,`FraudReport.reports`,`Authorization.at_merchant`],answered_in:`neptune`,query:`MATCH (c:Card)-[:IN_BIN_RANGE]->(:BinRange {id: $bin})

`},{id:`CQ-110`,domain:`risk`,question:`Which cards were used from more than three devices in the last 24 hours?`,walks:[`Authorization.with_card`,`Authorization.from_device`],answered_in:`snowflake`,query:`SELECT a.card_id,                                           -- Authorization.with_card

`},{id:`CQ-111`,domain:`risk`,question:`Which fraud chargebacks came from a device also seen at a merchant with fraud reports?`,walks:[`Chargeback.disputes`,`Capture.captures`,`Authorization.from_device`,`Chargeback.has_reason`,`Device.seen_at`,`Authorization.at_merchant`,`FraudReport.reports`],answered_in:`neptune`,query:`MATCH (cb:Chargeback)-[:DISPUTES]->(:Capture)-[:CAPTURES]->(:Authorization)-[:FROM_DEVICE]->(d:Device)
MATCH (cb)-[:HAS_REASON]->(:ReasonCode {id: $fraud_reason})

`},{id:`CQ-112`,domain:`risk`,question:`Which merchants' fraud reports, as a share of settled transactions, rose above their six-month average this month?`,walks:[`FraudReport.reports`,`Authorization.at_merchant`,`Settlement.settles`,`Capture.captures`],answered_in:`snowflake`,query:`WITH frauds AS (
  SELECT a.merchant_id, DATE_TRUNC('month', f.reported_at) AS month, COUNT(*) AS n   -- Authorization.at_merchant
  FROM fct_fraud_report f
  JOIN fct_authorization a ON a.authorization_id = f.authorization_id -- FraudReport.reports
  WHERE f.reported_at >= DATEADD('month', -6, DATE_TRUNC('month', CURRENT_DATE))
  GROUP BY 1, 2
),
settled AS (
  SELECT a.merchant_id, DATE_TRUNC('month', s.settled_at) AS month, COUNT(*) AS n   -- Authorization.at_merchant
  FROM fct_settlement_item s
  JOIN fct_capture c ON c.capture_id = s.capture_id                   -- Settlement.settles
  JOIN fct_authorization a ON a.authorization_id = c.authorization_id -- Capture.captures
  WHERE s.settled_at >= DATEADD('month', -6, DATE_TRUNC('month', CURRENT_DATE))
  GROUP BY 1, 2
),
rates AS (
  SELECT settled.merchant_id, settled.month, COALESCE(frauds.n, 0) / settled.n AS rate

  LEFT JOIN frauds ON frauds.merchant_id = settled.merchant_id AND frauds.month = settled.month
)
SELECT merchant_id,
       MAX(IFF(month = DATE_TRUNC('month', CURRENT_DATE), rate, NULL)) AS this_month,
       AVG(IFF(month < DATE_TRUNC('month', CURRENT_DATE), rate, NULL)) AS six_month_average
FROM rates
GROUP BY merchant_id
HAVING this_month > six_month_average
ORDER BY this_month - six_month_average DESC

poller`,p:[[545,240],[545,290]]},{id:`y2`,f:`poller`,t:`bedrock`,p:[[630,305],[662,305],[662,86],[680,86]]},{id:`y3`,f:`poller`,t:`opensearch`,p:[[545,344],[545,400]]},{id:`q1`,f:`agents`,t:`api`,p:[[900,257],[876,257],[876,280],[850,280]]},{id:`q2`,f:`analysts`,t:`api`,p:[[900,347],[876,347],[876,314],[850,314]]},{id:`q3`,f:`api`,t:`opensearch`,p:[[680,318],[670,318],[670,450],[630,450]]},{id:`q4`,f:`api`,t:`neptune`,p:[[680,276],[652,276],[652,200],[630,200]]},{id:`q5`,f:`api`,t:`bedrock`,p:[[765,260],[765,104]]}],gp={ontsrc:1,gen:1,pub:1,repos:2,events:2,docs:2,extract:2,stage:2,neptune:3,poller:3,opensearch:3,api:4,bedrock:4,agents:5,analysts:5,partners:5},_p={design:1,ingest:2,sync:3,query:4},vp={design:{name:`Design time`,color:`var(--onto)`,steps:[{title:`Change the ontology`,nodes:[`ontsrc`,`gen`],hops:[[`d1`]],text:`A domain owner merges a pull request to the LinkML source. CI regenerates the OWL, the SHACL shapes and every other artifact, and checks sample data against the shapes; a failing check stops the release before anything reaches a store.`},{title:`Generate every schema from one source`,nodes:[`gen`,`neptune`,`extract`,`opensearch`],hops:[[`d4`,`d5`,`d6`]],text:`The generator emits Neptune label chains and bulk-loader CSV headers, the schema the LLM must extract against, and the OpenSearch index mappings plus the ontology index. Both stores get their schema from the same build, so they cannot drift apart.`},{title:`Publish the release`,nodes:[`gen`,`pub`,`partners`],hops:[[`d2`],[`d3`]],text:`The release goes out at versioned IRIs as Turtle, JSON-LD and readable docs. Other teams pin a version and use the same definitions your graph uses, which is what makes the ontology a product rather than an internal schema.`}]},ingest:{name:`Ingest`,color:`var(--graph)`,steps:[{title:`Collect sources`,nodes:[`repos`,`events`,`docs`,`extract`],hops:[[`i1`,`i2`,`i3`]],text:`Code is parsed with tree-sitter: entities, enums, state machines, OpenAPI and Avro. Payment events are mapped deterministically, with no LLM involved. Documents are split into chunks.`},{title:`Extract with Claude`,nodes:[`extract`,`bedrock`],hops:[[`i4`],[`-i4`]],text:`For code and documents, Claude on Bedrock extracts entities and relationships constrained to the generated schema, and the embedding model embeds each chunk. Low-confidence results wait for human review, in a durable function that survives restarts.`},{title:`Write the graph`,nodes:[`extract`,`stage`,`neptune`],hops:[[`i8`,`i5`],[`i6`]],text:`Everyday writes use openCypher MERGE on deterministic IDs, so a rerun never duplicates anything. First loads and backfills go through S3 and the Neptune bulk loader.`},{title:`Store chunk text in OpenSearch`,nodes:[`extract`,`opensearch`,`neptune`],hops:[[`i7`]],text:`Chunk text and vectors go to the chunks index. Neptune gets only a small :Chunk node with MENTIONS edges to the entities it names, so any answer traces back to its source without storing text twice.`},{title:`Propose ontology changes`,nodes:[`extract`,`ontsrc`],hops:[[`i9`]],text:`When code shows something the ontology lacks, such as a new dispute state or enum value, the pipeline opens a pull request against the LinkML source. A person accepts it; the ontology never changes on its own.`}]},sync:{name:`Sync`,color:`var(--search)`,steps:[{title:`Capture the change`,nodes:[`neptune`,`poller`],hops:[[`y1`]],text:`Every committed write to Neptune appears on Neptune Streams in commit order. The poller resumes from the last stream position it checkpointed.`},{title:`Build the search document`,nodes:[`poller`,`bedrock`],hops:[[`y2`],[`-y2`]],text:`For each changed entity, the poller reads its label chain, names, aliases and codes, writes a short summary, and embeds it with the same model used for chunks.`},{title:`Upsert into OpenSearch`,nodes:[`poller`,`opensearch`],hops:[[`y3`]],text:`The document is upserted into the entities index with neptune_id as its _id. The index is derived data: if it is lost or corrupted, rebuild it from Neptune.`}]},query:{name:`Query`,color:`var(--query)`,steps:[{title:`Ask`,nodes:[`agents`,`api`],hops:[[`q1`]],text:`An agent calls a retrieval tool over MCP. For example: which merchants had the most 10.4 chargebacks last month, and what do the network rules say about 10.4?`},{title:`Find entry points in OpenSearch`,nodes:[`api`,`opensearch`],hops:[[`q3`],[`-q3`]],text:`Hybrid search, keyword plus vector, over the entities and chunks indexes. It returns Neptune IDs and chunk IDs rather than answers. Misspelled merchant names and bare codes resolve here.`},{title:`Write and check the Cypher`,nodes:[`api`,`opensearch`,`bedrock`],hops:[[`q3`],[`-q3`],[`q5`],[`-q5`]],text:`For counts and rankings, the service fetches the relevant classes from the ontology index, has Claude write a parameterized query, and validates it against the ontology before it runs.`},{title:`Traverse in Neptune`,nodes:[`api`,`neptune`],hops:[[`q4`],[`-q4`]],text:`The query runs on a Neptune reader, starting from the IDs found in OpenSearch. openCypher cannot call OpenSearch from inside a query, so the service does the join, by ID.`},{title:`Answer with citations`,nodes:[`api`,`bedrock`,`agents`],hops:[[`q5`],[`-q5`],[`-q1`]],text:`Claude writes the answer from the subgraph and the retrieved chunks only, citing node IDs and chunk IDs. Every sentence traces to a Cypher run or a source document.`}]}},yp={ontsrc:{title:`Ontology source`,what:`The product itself: payment classes, relationship types, properties and rules in LinkML, from which the OWL and the SHACL shapes that define valid data are generated. People write and approve it; the extraction pipeline only proposes changes as pull requests.`,holds:[`Class hierarchy, such as Chargeback under DisputeEvent under PaymentEvent`,`Allowed relationships and their direction`,`Property types and code lists`,`Mappings back to ISO 8583 data elements`],watch:`Treat renamed or removed classes as major versions. Every consumer, including your own indexes, pins a version.`},gen:{title:`Schema generator`,holdsLabel:`Outputs`,what:`A CI job, rdflib plus templates, that turns the ontology into every schema the runtime needs, so nobody writes a schema by hand twice.`,holds:[`Neptune label chains and bulk-loader CSV headers with types`,`Pydantic models for pipeline validation`,`Allowed nodes and relationships for LLM extraction`,`OpenSearch mappings and ontology index documents`,`The ontology meta-graph load for Neptune`],watch:`Fail the build if any generated file differs from what is committed. Hand edits are how the two stores drift apart.`},pub:{title:`Published ontology`,what:`Each release at stable, versioned IRIs, served from S3 behind CloudFront as Turtle, JSON-LD and readable HTML.`,holds:[`Release notes and changelog`,`A page per class with definition and examples`,`Downloadable SHACL shapes`],watch:`Never overwrite a published version. Fix forward with a patch release.`},repos:{title:`Code repositories`,what:`Bitbucket repositories parsed with tree-sitter to see how payments are modeled in running code.`,holds:[`JPA entities and enums`,`State machines for dispute and settlement flows`,`OpenAPI specs and Avro schemas`],watch:`Code tells you what exists, not what it means. Its findings reach the ontology only as reviewed pull requests.`},events:{title:`Payment events`,what:`Authorization, capture, settlement, refund and chargeback events from the processing platform, mapped without an LLM.`,holds:[`Named properties such as pos_entry_mode and response_code, not raw DE keys`,`A mapping table back to ISO 8583 data elements and subfields`],watch:`Tokens only. No PANs in either store, including inside chunk text.`},docs:{title:`Documents`,what:`Network rules, reason code guides, dispute runbooks and internal specs.`,holds:[`Chunks that keep their section headings`,`Links from each chunk to the entities it mentions`],watch:`Set an access classification on every chunk at ingest. Adding it later means re-reading every document.`},extract:{title:`Extraction pipeline`,holdsLabel:`Two jobs`,what:`Lambda durable functions: fan-out per source batch, steps that are checkpointed and retried, and a callback wait for human review of low-confidence results. Claude's mapping can run in LangGraph inside a step. Open-ended work on one repository, with the Claude Agent SDK, runs as a Fargate task the function waits on.`,holds:[`Main job: fill Neptune and OpenSearch with data validated against the generated schema`,`Side job: open a pull request when code shows something the ontology lacks`,`Never writes the ontology itself`],watch:`Make every write idempotent with deterministic IDs, so a retry or a rerun changes nothing.`},stage:{title:`Staging bucket`,what:`S3 staging for the Neptune bulk loader, in the openCypher CSV format with :ID, :LABEL, :START_ID, :END_ID, :TYPE and typed property columns.`,holds:[`First loads and backfills`,`A record of exactly what each release loaded`],watch:`Type codes such as MCC and response code as String, or leading zeros disappear.`},neptune:{title:`Neptune Database`,what:`The system of record for payment facts: every entity, event and relationship, queried with openCypher.`,holds:[`Entities and lifecycle events with deterministic IDs`,`Relationships with direction, per the ontology`,`The ontology as a small meta-graph`,`Chunk stubs with MENTIONS edges for provenance`,`ontology_version and source on every node`],keep:[`Long text`,`Embeddings`,`PANs`],watch:`Neptune enforces no schema, so the pipeline is the only enforcement. Turn on IAM authentication and Streams from the first day.`},poller:{title:`Stream poller`,holdsLabel:`Inside`,what:`A Lambda function that reads Neptune Streams and keeps the entities index current. Start from the AWS Neptune-to-OpenSearch replication stack and change its poller to write your document shape.`,holds:[`A checkpoint of the last stream position`,`The entity summary builder`,`The embedding call`],watch:`Alarm on replication lag. If the poller falls behind the stream retention window, rebuild the index from Neptune rather than catching up.`},opensearch:{title:`OpenSearch`,what:`The way into the graph. Three indexes, each derived from Neptune or from source documents, never the other way round.`,holds:[`entities: names, aliases, codes, labels, summary, vector`,`chunks: document text, vector, mentioned Neptune IDs`,`ontology: definitions used to write Cypher`],keep:[`Relationships as the source of truth`,`Anything you could not rebuild`],watch:`Put codes such as MCCs, reason codes and BINs in keyword fields. Analyzed text fields split them apart.`},bedrock:{title:`Amazon Bedrock`,what:`Claude for extraction, Cypher generation and answers, plus one embedding model for entities, chunks and ontology definitions.`,holds:[`Extraction prompts built from the generated schema`,`The pinned embedding model ID`],watch:`Changing the embedding model means rebuilding all three indexes. Plan it like an ontology major version.`},api:{title:`Retrieval service`,holdsLabel:`Inside`,what:`A LangGraph service that decides how to answer each question: lookups start in OpenSearch, relationship questions expand in Neptune, and counts or rankings go through validated text-to-Cypher.`,holds:[`The router`,`A Cypher validator built from the ontology`,`One access policy applied to results from both stores`],watch:`openCypher on Neptune cannot call OpenSearch from inside a query, so this service does the join, by ID.`},agents:{title:`Agents`,holdsLabel:`Tools`,what:`Agents reach retrieval through MCP tools behind AgentCore Gateway, never through direct database access. Other teams’ agents can hand them work over A2A.`,holds:[`search_entities`,`expand_subgraph`,`run_validated_cypher`,`get_ontology_class`],watch:`Do not expose a raw Cypher tool. Agents get validated, read-only, bounded queries.`},analysts:{title:`Analyst UI`,what:`A search box backed by OpenSearch and a graph explorer ba #
# It writes down what the page's overview and retrieval walkthrough already show:
# the running examples, the relationship names in their Cypher, the modeling
# patterns from chapter 1 (events not status fields, codes as nodes, one
# direction, a shallow hierarchy, roles), and the classes that chapter's
# competency-question rounds added. Prototype step 1 grows it into the real
# core, bootstrapped from ISO 20022, FIBO and ISO code lists (decision 9):
# each class maps to a standard concept, or says why none fits.
#
# Annotations used on classes, read by the class explorer (web/src/explorer):
#   owner        the team that owns the class (decision 9: layered ownership)
#   lives_in     where instances live: graph (Neptune), warehouse (lake or
#                Snowflake, joining the graph when a question walks through it)
#                or search (text in OpenSearch, a stub in Neptune) - decision 2
#   id_rule      the one ID used in every store (decision 4)
#   example      an instance from the pages' running examples, where one exists
#   no_standard  why a concrete class has no close_mappings
#   search_index which OpenSearch index holds a search class's documents
#   graph_load   never, for a warehouse class that never loads into Neptune,
#                such as settlement files and reconciliation (decision 2)
#
# And on relationships, read by tools/generate.py:
#   edge_properties  properties the edge carries, as name:NeptuneType
#
# Check it with: linkml-lint --config ontology/.linkmllint.yaml ontology/payments.yaml

id: https://ontology.example.com/payments
name: payments
title: Payments ontology (illustrative draft)
version: 1.11.0
prefixes:
  pay: https://ontology.example.com/payments/
  linkml: https://w3id.org/linkml/
  # Standards we align with through skos:closeMatch, never owl:imports (decision 9).
  # Every mapping was checked on 2026-09-30 against the releases pinned below.
  cmns-pts: https://www.omg.org/spec/Commons/PartiesAndSituations/
  cmns-org: https://www.omg.org/spec/Commons/Organizations/
  cmns-doc: https://www.omg.org/spec/Commons/Documents/
  fibo-fnd-aap-ppl: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/
  fibo-be-fct-fct: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/
  fibo-loan-spc-crd: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/
  fibo-fbc-fct-usjrga: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/
  fibo-fbc-fi-stl: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/
  # ISO 20022 publishes identifiers for message definitions, not for the events
  # they carry, so a lifecycle event maps to the message that starts it, named by
  # its XML namespace. The version in each name is the pin.
  iso20022: "urn:iso:std:iso:20022:tech:xsd:"
default_prefix: pay
default_range: string
imports:
  - linkml:types
annotations:
  fibo_release: https://spec.edmcouncil.org/fibo/ontology/master/2026Q2/
  commons_release: https://www.omg.org/spec/Commons/20250801/

classes:

  # ---------- Parties and the roles they play ----------

  Party:
    abstract: true
    description: A person or organization that takes part in payments.
    close_mappings: [cmns-pts:Party]
    slots: [id, name, acts_as]
    annotations:
      owner: core
      lives_in: graph

  Person:
    is_a: Party
    description: An individual, such as a cardholder.
    close_mappings: [fibo-fnd-aap-ppl:Person]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "person:{person_id}"
      example: "Maya"

  Organization:
    is_a: Party
    description: >-
      A company or institution. One bank is one Organization, however many
      roles it plays.
    close_mappings: [cmns-org:Organization]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "org:{org_id}"
      example: "First Bay Bank"

  PartyRole:
    abstract: true
    description: >-
      A role a party plays, such as issuer or merchant. Roles keep one bank
      from turning into two nodes.
    close_mappings: [cmns-pts:PartyRole]
    slots: [id]
    annotations:
      owner: core
      lives_in: graph

  Cardholder:
    is_a: PartyRole
    description: The person a card is issued to.
    close_mappings: [fibo-loan-spc-crd:Cardholder]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "ch:{cardholder_id}"
      example: "Maya"

  Issuer:
    is_a: PartyRole
    description: The bank that issues cards and approves or declines their authorizations.
    close_mappings: [fibo-loan-spc-crd:IssuingFinancialInstitution]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "iss:{issuer_id}"
      example: "First Bay Bank"

  Acquirer:
    is_a: PartyRole
    description: The bank that signs up merchants and claims funds for them.
    annotations:
      owner: core
      lives_in: graph
      id_rule: "acq:{acquirer_id}"
      no_standard: >-
        FIBO has no acquirer. ISO 20022 names the acquirer only as a party
        inside card messages, with no identifier of its own.
      example: "Coastal Acquiring"

  Merchant:
    is_a: PartyRole
    description: A business that accepts cards, as its acquirer knows it.
    aliases: [store, merchant outlet]
    close_mappings: [fibo-be-fct-fct:Merchant]
    slots: [name, mcc, country, acquired_by]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "m:{merchant_id}"
      example: "m:88213, Harbor Grill #4, MCC 5812"

  # ---------- Instruments ----------

  Card:
    description: A payment card, identified by a token rather than its number.
    aliases: [PAN, token]
    close_mappings: [fibo-loan-spc-crd:PaymentCard]
    slots: [id, network, held_by, in_bin_range]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "card:{token}"
      example: "card:tk_1a3"

  BinRange:
    description: >-
      The range of card numbers a bank issues from. A node rather than a
      string, so authorizations can be grouped by it.
    aliases: [BIN, IIN]
    close_mappings: [fibo-fbc-fct-usjrga:IssuerIdentificationNumber]
    slots: [id, prefix, funding_source, country, assigned_to]
    annotations:
      owner: authorization
      lives_in: graph
      id_rule: "bin:{prefix}"

  Device:
    description: A phone, browser or terminal an authorization came from.
    slots: [id, seen_at]
    annotations:
      owner: risk
      lives_in: graph
      id_rule: "dev:{device_id}"
      no_standard: >-
        ISO 20022 describes the point of interaction inside card messages,
        with no identifier of its own. FIBO has no device.

  # ---------- Events in a payment's life ----------

  PaymentEvent:
    abstract: true
    description: >-
      Something that happened to a payment, at a time. Each step is its own
      event, instead of a status field that keeps being overwritten.
    slots: [id]
    annotations:
      owner: core
      lives_in: graph

  Authorization:
    is_a: PaymentEvent
    description: The issuer's approval or decline of a payment request.
    aliases: [auth, approval]
    close_mappings: [iso20022:cain.001.001.05]
    slots: [authorized_at, amount, approved_amount, currency, channel, authorization_type, credential, token_requestor,
            initiated_by, standing_instruction, decided_by, at_merchant, with_card, from_device, has_response,
            authenticated_by, increments]
    slot_usage:
      at_merchant:
        required: true
      with_card:
        required: true
      has_response:
        required: true
    annotations:
      owner: authorization
      lives_in: warehouse
      id_rule: "auth:{authorization_id}"
      example: "auth:5521, Aug 3, $42.50, card not present"

  Authentication:
    is_a: PaymentEvent
    description: >-
      The issuer checking that the cardholder is who they say, before an
      authorization, such as a 3-D Secure attempt.
    aliases: [3-D Secure, 3DS, cardholder authentication]
    slots: [authenticated_at, authentication_result, challenged]
    slot_usage:
      authentication_result:
        required: true
    annotations:
      owner: authorization
      lives_in: warehouse
      id_rule: "authn:{authentication_id}"
      no_standard: >-
        3-D Secure is an EMVCo protocol. No ISO 20022 message or FIBO concept
        stands for an authentication on its own.

  Reversal:
    is_a: PaymentEvent
    description: >-
      The acquirer cancelling all or part of an authorization, so the issuer
      releases the hold on the cardholder's funds.
    aliases: [authorization reversal]
    close_mappings: [iso20022:cain.005.001.05]
    slots: [reversed_at, amount, currency, reverses]
    slot_usage:
      reverses:
        required: true
    annotations:
      owner: authorization
      lives_in: warehouse
      id_rule: "rev:{reversal_id}"

  Capture:
    is_a: PaymentEvent
    description: The merchant claiming the funds an authorization approved.
    aliases: [clearing, presentment]
    close_mappings: [iso20022:cain.003.001.05]
    slots: [captured_at, amount, currency, conversion_rate, interchange_fee, captures, qualifies_for, in_batch]
    slot_usage:
      captures:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "cap:{capture_id}"
      example: "cap:7731, Aug 4, $42.50"

  Settlement:
    is_a: PaymentEvent
    description: Funds moving between the banks for a batch of captures.
    close_mappings: [fibo-fbc-fi-stl:SettlementEvent]
    slots: [settled_at, amount, currency, settles]
    slot_usage:
      settles:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "stl:{settlement_id}"

  Adjustment:
    is_a: PaymentEvent
    description: >-
      A correction to a capture after it cleared, such as a changed amount,
      made under the network's rules.
    aliases: [clearing adjustment, correction]
    slots: [adjusted_at, amount, currency, adjusts]
    slot_usage:
      adjusts:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "adj:{adjustment_id}"
      no_standard: >-
        ISO 20022's Amendment (cain.020) reports a corrected message, not a
        change to a settled amount. Networks run adjustments under their own
        rules.

  Payout:
    is_a: PaymentEvent
    description: >-
      The acquirer paying a merchant for its settled captures, less fees and
      any amount held back in reserve.
    aliases: [merchant funding, deposit, remittance]
    slots: [paid_at, amount, currency, reserve_amount, funds]
    slot_usage:
      funds:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "po:{payout_id}"
      no_standard: >-
        Acquirers pay merchants by ordinary bank transfer, outside the card
        messages, and FIBO has no merchant funding concept.

  Refund:
    is_a: PaymentEvent
    description: The merchant returning all or part of a captured amount.
    aliases: [credit]
    slots: [refunded_at, amount, currency, refunds]
    slot_usage:
      refunds:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "rf:{refund_id}"
      no_standard: >-
        ISO 20022 sends a refund as a financial message with a refund
        transaction type, so no message stands for refunds alone.

  FraudReport:
    is_a: PaymentEvent
    description: An issuer reporting an authorization as fraud to the network.
    aliases: [TC40, SAFE report]
    close_mappings: [iso20022:cafr.001.001.04]
    slots: [reported_at, reports]
    slot_usage:
      reports:
        required: true
    annotations:
      owner: risk
      lives_in: graph
      id_rule: "fr:{report_id}"

  DisputeEvent:
    is_a: PaymentEvent
    abstract: true
    description: >-
      A step in a dispute over a captured transaction. Each step carries the
      amount in dispute and, while it waits for an answer, the date the other
      side must respond by.
    slots: [opened_at, respond_by, amount, currency, disputes, has_reason, responds_to]
    annotations:
      owner: disputes
      lives_in: graph

  RetrievalRequest:
    is_a: DisputeEvent
    description: >-
      The issuer asking the acquirer for the original transaction details,
      often before it decides whether to dispute.
    aliases: [copy request, request for copy]
    close_mappings: [iso20022:cain.021.001.04]
    slot_usage:
      disputes:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rr:{retrieval_id}"

  Chargeback:
    is_a: DisputeEvent
    title: Chargeback
    aliases: [CB, chargeback case]
    close_mappings: [iso20022:cain.027.001.04]
    description: >-
      A dispute event in which the issuer, through the card network,
      reverses all or part of a captured transaction for the cardholder.
    slot_usage:
      disputes:
        required: true
      has_reason:
        required: true
      opened_at:
        required: true
      amount:
        required: true
      currency:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "cb:{chargeback_id}"
      example: "cb:1001, Aug 19, reason 10.4, $42.50"

  Representment:
    is_a: DisputeEvent
    description: The merchant's response to a chargeback, with its evidence.
    aliases: [second presentment, merchant response]
    slots: [has_evidence]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rep:{representment_id}"
      no_standard: >-
        ISO 20022's chargeback response (cain.028) answers a chargeback, but
        whether it carries the merchant's evidence isn't confirmed yet.

  PreArbitration:
    is_a: DisputeEvent
    description: Issuer challenges the merchant's response before arbitration.
    aliases: [pre-arb]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "parb:{pre_arbitration_id}"
      no_standard: >-
        Pre-arbitration is a card network rule, with no ISO 20022 message or
        FIBO concept of its own.

  Arbitration:
    is_a: DisputeEvent
    description: >-
      Either side asking the card network to decide a dispute that
      pre-arbitration didn't settle. The network's ruling is binding.
    aliases: [arbitration case]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "arb:{arbitration_id}"
      no_standard: >-
        Arbitration is a card network rule, with no ISO 20022 message or
        FIBO concept of its own.

  DisputeOutcome:
    is_a: DisputeEvent
    description: >-
      The event that closes a dispute: which side won, how it ended, and the
      amount that finally went back to the cardholder. It answers the
      dispute's last step, and links to the disputed capture, as the
      chargeback does.
    aliases: [dispute resolution, case closure]
    slots: [won_by, closure]
    slot_usage:
      disputes:
        required: true
      responds_to:
        required: true
      won_by:
        required: true
      closure:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "out:{outcome_id}"
      no_standard: >-
        The ISO 20022 card messages carry the steps of a dispute, but none
        stands for its outcome. Networks record it in their own case systems.

  # ---------- Money between the members: warehouse only (decision 2) ----------

  ClearingBatch:
    description: >-
      A batch of captures sent for clearing and settlement in one exchange,
      such as an acquirer's clearing file.
    aliases: [clearing file, settlement file, batch]
    close_mappings: [iso20022:caad.003.001.04]
    slots: [id, sent_at]
    annotations:
      owner: settlement
      lives_in: warehouse
      graph_load: never
      id_rule: "batch:{batch_id}"

  Reconciliation:
    description: >-
      A member checking its totals for a settlement against the network's,
      and recording any difference.
    aliases: [recon, settlement reconciliation]
    close_mappings: [iso20022:caad.005.001.05]
    slots: [id, reconciled_at, matched, difference, currency, reconciles]
    slot_usage:
      reconciles:
        required: true
      matched:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      graph_load: never
      id_rule: "rec:{reconciliation_id}"

  FeeCollection:
    description: >-
      The network collecting fees from a member, an issuer or an acquirer,
      such as its monthly assessments.
    aliases: [network fees, assessments, network billing]
    close_mappings: [iso20022:cafc.001.001.04]
    slots: [id, collected_at, amount, currency, collected_from, under]
    slot_usage:
      collected_from:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      graph_load: never
      id_rule: "fc:{collection_id}"

  # ---------- Codes and documents ----------

  FeeProgram:
    description: >-
      A fee a network publishes, such as an interchange category a capture
      qualifies for. A node, so captures and the fees charged meet at one
      place; the amounts stay in Snowflake (decision 2).
    aliases: [interchange category, interchange program, fee schedule]
    slots: [id, network, code, name, fee_type]
    annotations:
      owner: settlement
      lives_in: graph
      id_rule: "fee:{network}:{code}"
      no_standard: >-
        Each network publishes its own interchange programs and fees; no ISO
        list or FIBO concept covers them.

  ReasonCode:
    description: >-
      A network's reason for a dispute. A node, so chargebacks and the
      documents that explain the code meet at one place.
    aliases: [dispute reason]
    slots: [id, network, code]
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rc:{network}:{code}"
      no_standard: >-
        Each card network publishes its own dispute reason codes; no ISO
        list covers them.
      example: "rc:visa:10.4, Other Fraud: Card-Absent Environment"
      code_list: VisaReasonCode

  ResponseCode:
    description: The issuer's answer code on an authorization, such as approved or declined.
    slots: [id, code]
    annotations:
      owner: authorization
      lives_in: graph
      id_rule: "resp:{code}"
      no_standard: >-
        Response codes come from ISO 8583 and each network's rules, which
        publish no identifiers to map to.

  Document:
    description: >-
      A network rule book, runbook or piece of evidence. Its text lives in
      search; Neptune keeps a stub.
    close_mappings: [cmns-doc:Document]
    slots: [id, name, kind]
    annotations:
      owner: core
      lives_in: search
      id_rule: "{doc_slug}"
      example: "visa-vamp-2026"

  Chunk:
    description: >-
      A passage of a document. Its text and embedding live in OpenSearch; the
      stub in Neptune links it to the entities it mentions.
    slots: [id, part_of, mentions]
    annotations:
      owner: core
      lives_in: search
      id_rule: "{doc_slug}#{chunk}"
      search_index: chunks
      no_standard: >-
        A passage of an indexed document is this platform's own idea.
      example: "visa-vamp-2026#c04"

  # ---------- Open ranges ----------

  Any:
    class_uri: linkml:Any
    description: >-
      Any entity with an ID. A relationship whose range is Any can point at a
      node of any class, as a chunk's MENTIONS does. Not a node itself.

slots:

  # ---------- Attributes ----------

  id:
    identifier: true
    description: The one ID used in Neptune, OpenSearch and Snowflake.
  name:
    description: What people call it.
  mcc:
    description: Merchant category code, from ISO 18245.
    pattern: "^\\\\d{4}$"
    close_mappings: [fibo-be-fct-fct:MerchantCategoryCode]
  network:
    description: The card network whose rules apply.
    range: CardNetwork
  code:
    description: The code as the network or issuer writes it.
  prefix:
    description: The leading digits every card in the range shares.
  kind:
    description: What sort of document it is.
    range: DocumentKind
  amount:
    description: The amount, in the transaction currency.
    range: decimal
  currency:
    description: The transaction currency, as an ISO 4217 alphabetic code such as USD.
    pattern: "^[A-Z]{3}$"
  channel:
    description: Whether the card was present.
    range: Channel
  approved_amount:
    description: >-
      The amount the issuer approved, when less than the amount requested: a
      partial approval.
    range: decimal
  authorization_type:
    description: Whether an authorization's amount is final, an estimate, or an increase to an earlier estimate.
    range: AuthorizationType
  initiated_by:
    description: >-
      Who started the payment, under the networks' stored-credential rules:
      the cardholder, or the merchant using a card it keeps on file.
    range: Initiator
  standing_instruction:
    description: The agreement a merchant-initiated payment follows, such as a subscription.
    range: StandingInstruction
  decided_by:
    description: >-
      Who answered the authorization: the issuer, or stand-in processing
      answering for an issuer that couldn't.
    range: Decider
  credential:
    description: What stood in for the card number in an authorization.
    range: Credential
  token_requestor:
    description: >-
      The Token Requestor ID of the wallet or merchant a network token was
      issued to: 11 digits, assigned under EMVCo's payment tokenisation.
    pattern: "^\\\\d{11}$"
  funding_source:
    description: >-
      Where the money behind the cards in a BIN range comes from, as the
      network's BIN table reports it.
    range: FundingSource
  country:
    description: >-
      A country, as an ISO 3166-1 alpha-2 code such as US: where a merchant
      trades, or where a BIN range is licensed.
    pattern: "^[A-Z]{2}$"
  authentication_result:
    description: How an authentication ended, as EMV 3-D Secure's final transaction status reports it.
    range: AuthenticationResult
  challenged:
    description: >-
      Whether the issuer challenged the cardholder, such as with a one-time
      code, rather than letting the payment through without friction.
    range: boolean
  authorized_at:
    description: When the issuer answered.
    range: datetime
  captured_at:
    description: When the merchant claimed the funds.
    range: datetime
  settled_at:
    description: When the funds moved.
    range: datetime
  refunded_at:
    description: When the refund was made.
    range: datetime
  adjusted_at:
    description: When the adjustment was made.
    range: datetime
  paid_at:
    description: When the acquirer paid the merchant.
    range: datetime
  sent_at:
    description: When the batch was sent.
    range: datetime
  reconciled_at:
    description: When the totals were checked.
    range: datetime
  collected_at:
    description: When the network collected the fees.
    range: datetime
  conversion_rate:
    description: >-
      The rate that converted a capture's amount into its settlement's
      currency, when the two differ.
    range: decimal
  interchange_fee:
    description: >-
      The interchange the capture paid, in its settlement's currency. The
      amount stays in Snowflake; the program it qualified for is a node.
    range: decimal
  reserve_amount:
    description: >-
      The amount held back from a payout into the merchant's reserve;
      negative when the acquirer releases reserve.
    range: decimal
  matched:
    description: Whether the member's totals matched the network's.
    range: boolean
  difference:
    description: The amount by which the totals differed.
    range: decimal
  fee_type:
    description: What kind of fee a program sets.
    range: FeeType
  reversed_at:
    description: When the acquirer sent the reversal.
    range: datetime
  authenticated_at:
    description: When the cardholder was authenticated.
    range: datetime
  reported_at:
    description: When the fraud was reported.
    range: datetime
  opened_at:
    description: When the dispute step began.
    range: datetime
  respond_by:
    description: >-
      When the other side must answer this step by, under the network's rules
      for the stage. Missing it decides the dispute against that side.
    range: datetime
  won_by:
    description: The side a dispute ended in favor of.
    range: DisputeSide
  closure:
    description: How a dispute ended.
    range: DisputeClosure

  # ---------- Relationships: one canonical direction each ----------

  acts_as:
    description: A party plays a role.
    range: PartyRole
    multivalued: true
  acquired_by:
    description: A merchant's acquiring bank.
    range: Acquirer
  held_by:
    description: Who a card is issued to.
    range: Cardholder
  in_bin_range:
    description: The BIN range a card's number falls in.
    range: BinRange
  assigned_to:
    description: The issuer a BIN range belongs to.
    range: Issuer
  at_merchant:
    description: Where an authorization was requested.
    range: Merchant
  with_card:
    description: The card an authorization used.
    range: Card
  from_device:
    description: The device an authorization came from.
    range: Device
  seen_at:
    description: >-
      A summary edge, rebuilt daily from Snowflake: the device made
      authorizations at the merchant. It carries auths, first_seen and
      last_seen, so risk walks don't need every authorization in the graph
      (decision 2).
    range: Merchant
    multivalued: true
    annotations:
      edge_properties: "auths:Long, first_seen:DateTime, last_seen:DateTime"
  has_response:
    description: The issuer's answer to an authorization.
    range: ResponseCode
  authenticated_by:
    description: The authentication an authorization relied on.
    range: Authentication
  increments:
    description: The earlier authorization an incremental authorization adds to.
    range: Authorization
  reverses:
    description: The authorization a reversal cancels.
    range: Authorization
  captures:
    description: The authorization a capture claims funds for.
    range: Authorization
  settles:
    description: The captures a settlement pays out.
    range: Capture
    multivalued: true
  refunds:
    description: The capture a refund returns money from.
    range: Capture
  adjusts:
    description: The capture an adjustment corrects.
    range: Capture
  funds:
    description: The captures a payout pays the merchant for.
    range: Capture
    multivalued: true
  qualifies_for:
    description: The interchange program a capture qualified for.
    range: FeeProgram
  in_batch:
    description: The batch that carried a capture to the network.
    range: ClearingBatch
  reconciles:
    description: The settlement whose totals were checked.
    range: Settlement
  collected_from:
    description: The member the fees were collected from, an issuer or an acquirer.
    range: PartyRole
  under:
    description: The fee program a collection charges.
    range: FeeProgram
  disputes:
    description: Links a dispute event to the capture it contests.
    range: Capture
  has_reason:
    description: The network reason codes behind a dispute.
    range: ReasonCode
    multivalued: true
  responds_to:
    description: The earlier dispute event this one answers.
    range: DisputeEvent
  has_evidence:
    description: Documents sent as evidence.
    range: Document
    multivalued: true
  reports:
    description: The authorization a fraud report is about.
    range: Authorization
  part_of:
    description: The document a chunk comes from.
    range: Document
  mentions:
    description: >-
      Anything a chunk names, such as a merchant, a reason code or a dispute,
      so its text links to the graph.
    range: Any
    multivalued: true

enums:

  CardNetwork:
    description: Card networks whose rules the ontology covers.
    close_mappings: [fibo-loan-spc-crd:CreditCardNetwork]
    permissible_values:
      visa:
        meaning: fibo-loan-spc-crd:VisaNetwork
      mastercard:
        meaning: fibo-loan-spc-crd:MastercardNetwork

  Channel:
    description: How the card took part in a payment.
    permissible_values:
      card_present:
      card_not_present:

  AuthorizationType:
    description: >-
      What an authorization's amount means. Visa names estimated and
      incremental authorizations; Mastercard names preauthorizations,
      undefined and final authorizations.
    permissible_values:
      final:
        description: The amount is final, and the payment will be captured for it.
      estimated:
        description: >-
          The final amount isn't known yet, such as at a hotel or car rental.
          Mastercard calls it a preauthorization.
      incremental:
        description: An increase to an earlier estimated authorization.
      undefined:
        description: Neither final nor an estimate, in Mastercard's terms.

  Initiator:
    description: Who started a payment, under the networks' stored-credential rules.
    permissible_values:
      cardholder:
        description: The cardholder took part, such as at a checkout.
      merchant:
        description: The merchant charged a card it keeps on file, under an agreement with the cardholder.

  StandingInstruction:
    description: The agreement a merchant-initiated payment follows.
    permissible_values:
      recurring:
        description: Regular charges, such as a subscription.
      installment:
        description: A set number of payments for one purchase.
      unscheduled:
        description: Charges at no fixed time, such as a top-up when a balance runs low.

  Decider:
    description: Who answered an authorization.
    permissible_values:
      issuer:
        description: The issuer, or its processor, decided.
      network_stand_in:
        description: The network's stand-in processing answered for the issuer, such as Visa's STIP.
      processor_stand_in:
        description: The issuer's processor answered with its own stand-in rules.

  FeeType:
    description: What kind of fee a program sets.
    permissible_values:
      interchange:
        description: Paid by the acquirer to the issuer on each capture.
      network_fee:
        description: Charged by the network to its members, such as assessments.

  Credential:
    description: What stood in for the card number in an authorization.
    permissible_values:
      pan:
        description: The card number itself.
      card_on_file_token:
        description: A network token a merchant or processor keeps on file.
      wallet_token:
        description: A network token held in a digital wallet, such as a phone's.

  FundingSource:
    description: Where the money behind a card comes from, as networks' BIN tables report it.
    permissible_values:
      credit:
        description: A line of credit.
        close_mappings: [fibo-loan-spc-crd:CreditCard]
      debit:
        description: A deposit account.
        close_mappings: [fibo-loan-spc-crd:DebitCard]
      prepaid:
        description: Funds loaded onto the card in advance.

  AuthenticationResult:
    description: How a cardholder authentication ended, following EMV 3-D Secure's final transaction status.
    permissible_values:
      authenticated:
        description: The cardholder was verified (status Y).
      attempted:
        description: Not verified, but proof of an attempt is provided (status A).
      not_authenticated:
        description: Not verified, and the transaction is denied (status N).
      rejected:
        description: The issuer rejected it and asks that no authorization be attempted (status R).
      unavailable:
        description: It couldn't be performed, for a technical or other reason (status U).

  DisputeSide:
    description: The two sides of a card dispute. Each bank stands in for its customer.
    permissible_values:
