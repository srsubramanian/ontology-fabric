[630,200]]},{id:`q5`,f:`api`,t:`bedrock`,p:[[765,260],[765,104]]}],rp={ontsrc:1,gen:1,pub:1,repos:2,events:2,docs:2,extract:2,stage:2,neptune:3,poller:3,opensearch:3,api:4,bedrock:4,agents:5,analysts:5,partners:5},X={design:1,ingest:2,sync:3,query:4},ip={design:{name:`Design time`,color:`var(--onto)`,steps:[{title:`Change the ontology`,nodes:[`ontsrc`,`gen`],hops:[[`d1`]],text:`A domain owner merges a pull request to the LinkML source. CI regenerates the OWL, the SHACL shapes and every other artifact, and checks sample data against the shapes; a failing check stops the release before anything reaches a store.`},{title:`Generate every schema from one source`,nodes:[`gen`,`neptune`,`extract`,`opensearch`],hops:[[`d4`,`d5`,`d6`]],text:`The generator emits Neptune label chains and bulk-loader CSV headers, the schema the LLM must extract against, and the OpenSearch index mappings plus the ontology index. Both stores get their schema from the same build, so they cannot drift apart.`},{title:`Publish the release`,nodes:[`gen`,`pub`,`partners`],hops:[[`d2`],[`d3`]],text:`The release goes out at versioned IRIs as Turtle, JSON-LD and readable docs. Other teams pin a version and use the same definitions your graph uses, which is what makes the ontology a product rather than an internal schema.`}]},ingest:{name:`Ingest`,color:`var(--graph)`,steps:[{title:`Collect sources`,nodes:[`repos`,`events`,`docs`,`extract`],hops:[[`i1`,`i2`,`i3`]],text:`Code is parsed with tree-sitter: entities, enums, state machines, OpenAPI and Avro. Payment events are mapped deterministically, with no LLM involved. Documents are split into chunks.`},{title:`Extract with Claude`,nodes:[`extract`,`bedrock`],hops:[[`i4`],[`-i4`]],text:`For code and documents, Claude on Bedrock extracts entities and relationships constrained to the generated schema, and the embedding model embeds each chunk. Low-confidence results wait for human review, in a durable function that survives restarts.`},{title:`Write the graph`,nodes:[`extract`,`stage`,`neptune`],hops:[[`i8`,`i5`],[`i6`]],text:`Everyday writes use openCypher MERGE on deterministic IDs, so a rerun never duplicates anything. First loads and backfills go through S3 and the Neptune bulk loader.`},{title:`Store chunk text in OpenSearch`,nodes:[`extract`,`opensearch`,`neptune`],hops:[[`i7`]],text:`Chunk text and vectors go to the chunks index. Neptune gets only a small :Chunk node with MENTIONS edges to the entities it names, so any answer traces back to its source without storing text twice.`},{title:`Propose ontology changes`,nodes:[`extract`,`ontsrc`],hops:[[`i9`]],text:`When code shows something the ontology lacks, such as a new dispute state or enum value, the pipeline opens a pull request against the LinkML source. A person accepts it; the ontology never changes on its own.`}]},sync:{name:`Sync`,color:`var(--search)`,steps:[{title:`Capture the change`,nodes:[`neptune`,`poller`],hops:[[`y1`]],text:`Every committed write to Neptune appears on Neptune Streams in commit order. The poller resumes from the last stream position it checkpointed.`},{title:`Build the search document`,nodes:[`poller`,`bedrock`],hops:[[`y2`],[`-y2`]],text:`For each changed entity, the poller reads its label chain, names, aliases and codes, writes a short summary, and embeds it with the same model used for chunks.`},{title:`Upsert into OpenSearch`,nodes:[`poller`,`opensearch`],hops:[[`y3`]],text:`The document is upserted into the entities index with neptune_id as its _id. The index is derived data: if it is lost or corrupted, rebuild it from Neptune.`}]},query:{name:`Query`,color:`var(--query)`,steps:[{title:`Ask`,nodes:[`agents`,`api`],hops:[[`q1`]],text:`An agent calls a retrieval tool over MCP. For example: which merchants had the most 10.4 chargebacks last month, and what do the network rules say about 10.4?`},{title:`Find entry points in OpenSearch`,nodes:[`api`,`opensearch`],hops:[[`q3`],[`-q3`]],text:`Hybrid search, keyword plus vector, over cuments`,`The ontology meta-graph load for Neptune`],watch:`Fail the build if any generated file differs from what is committed. Hand edits are how the two stores drift apart.`},pub:{title:`Published ontology`,what:`Each release at stable, versioned IRIs, served from S3 behind CloudFront as Turtle, JSON-LD and readable HTML.`,holds:[`Release notes and changelog`,`A page per class with definition and examples`,`Downloadable SHACL shapes`],watch:`Never overwrite a published version. Fix forward with a patch release.`},repos:{title:`Code repositories`,what:`Bitbucket repositories parsed with tree-sitter to see how payments are modeled in running code.`,holds:[`JPA entities and enums`,`State machines for dispute and settlement flows`,`OpenAPI specs and Avro schemas`],watch:`Code tells you what exists, not what it means. Its findings reach the ontology only as reviewed pull requests.`},events:{title:`Payment events`,what:`Authorization, capture, settlement, refund and chargeback events from the processing platform, mapped without an LLM.`,holds:[`Named properties such as pos_entry_mode and response_code, not raw DE keys`,`A mapping table back to ISO 8583 data elements and subfields`],watch:`Tokens only. No PANs in either store, including inside chunk text.`},docs:{title:`Documents`,what:`Network rules, reason code guides, dispute runbooks and internal specs.`,holds:[`Chunks that keep their section headings`,`Links from each chunk to the entities it mentions`],watch:`Set an access classification on every chunk at ingest. Adding it later means re-reading every document.`},extract:{title:`Extraction pipeline`,holdsLabel:`Two jobs`,what:`Lambda durable functions: fan-out per source batch, steps that are checkpointed and retried, and a callback wait for human review of low-confidence results. Claude's mapping can run in LangGraph inside a step. Open-ended work on one repository, with the Claude Agent SDK, runs as a Fargate task the function waits on.`,holds:[`Main job: fill Neptune and OpenSearch with data validated against the generated schema`,`Side job: open a pull request when code shows something the ontology lacks`,`Never writes the ontology itself`],watch:`Make every write idempotent with deterministic IDs, so a retry or a rerun changes nothing.`},stage:{title:`Staging bucket`,what:`S3 staging for the Neptune bulk loader, in the openCypher CSV format with :ID, :LABEL, :START_ID, :END_ID, :TYPE and typed property columns.`,holds:[`First loads and backfills`,`A record of exactly what each release loaded`],watch:`Type codes such as MCC and response code as String, or leading zeros disappear.`},neptune:{title:`Neptune Database`,what:`The system of record for payment facts: every entity, event and relationship, queried with openCypher.`,holds:[`Entities and lifecycle events with deterministic IDs`,`Relationships with direction, per the ontology`,`The ontology as a small meta-graph`,`Chunk stubs with MENTIONS edges for provenance`,`ontology_version and source on every node`],keep:[`Long text`,`Embeddings`,`PANs`],watch:`Neptune enforces no schema, so the pipeline is the only enforcement. Turn on IAM authentication and Streams from the first day.`},poller:{title:`Stream poller`,holdsLabel:`Inside`,what:`A Lambda function that reads Neptune Streams and keeps the entities index current. Start from the AWS Neptune-to-OpenSearch replication stack and change its poller to write your document shape.`,holds:[`A checkpoint of the last stream position`,`The entity summary builder`,`The embedding call`],watch:`Alarm on replication lag. If the poller falls behind the stream retention window, rebuild the index from Neptune rather than catching up.`},opensearch:{title:`OpenSearch`,what:`The way into the graph. Three indexes, each derived from Neptune or from source documents, never the other way round.`,holds:[`entities: names, aliases, codes, labels, summary, vector`,`chunks: document text, vector, mentioned Neptune IDs`,`ontology: definitions used to write Cypher`],keep:[`Relationships as the source of truth`,`Anything you could not rebuild`],watch:`Put codes such as MCCs, reason codes and BINs in keyword fields. Analyzed text fields split them apart.`},bedrock:{title:`Amazon Bedrock`,what:`Claude for extraction, Cypher generation and answers, plus one embedding model for entities, chunks and ontology definitions.`,holds:[`Extraction prompts built from the generated schema`,`The pinned embedding model ID`],watch:`Changing the embedding model means rebuilding all three indexes. Plan it like an ontology major version.`},api:{title:`Retrieval service`,holdsLabel:`Inside`,what:`A LangGraph service that decides how to answer each question: lookups start in OpenSearch, relationship questions expand in Neptune, and counts or rankings go through validated text-to-Cypher.`,holds:[`The router`,`A Cypher validator built from the ontology`,`One access policy applied to results from both stores`],watch:`openCypher on Neptune cannot call OpenSearch from inside a query, so this service does the join, by ID.`},agents:{title:`Agents`,holdsLabel:`Tools`,what:`Agents reach retrieval through MCP tools behind AgentCore Gateway, never through direct database access. Other teams’ agents can hand them work over A2A.`,holds:[`search_entities`,`expand_subgraph`,`run_validated_cypher`,`get_ontology_class`],watch:`Do not expose a raw Cypher tool. Agents get validated, read-only, bounded queries.`},analysts:{title:`Analyst UI`,what:`A search box backed by OpenSearch and a graph explorer backed by Neptune. Every node links to its ontology definition.`,holds:[`Saved queries for common lineage questions`],watch:`Route it through the retrieval service so the same access policy applies as for agents.`},partners:{title:`Other teams and partners`,what:`Business units and partners consume ontology releases as the shared definition of payment concepts.`,holds:[`A pinned ontology version`,`Their own mappings to your classes`],watch:`Announce deprecations one release ahead, as you would for an API.`}},op=[{n:1,title:`Design the ontology`,short:`Ontology`,c:`var(--onto)`,nodes:[`ontsrc`,`gen`,`pub`]},{n:2,title:`Fill the graph`,short:`Ingest`,c:`var(--graph)`,nodes:[`repos`,`events`,`docs`,`extract`,`stage`,`bedrock`]},{n:3,title:`Two stores, one join`,short:`Stores`,c:`var(--search)`,nodes:[`neptune`,`poller`,`opensearch`]},{n:4,title:`Answer a question`,short:`Retrieval`,c:`var(--query)`,nodes:[`api`,`opensearch`,`neptune`,`bedrock`]},{n:5,title:`Who uses it`,short:`Users`,c:`var(--query)`,nodes:[`agents`,`analysts`,`partners`,`api`,`pub`]},{n:6,title:`Keep it current`,short:`Evolve`,c:`var(--onto)`,nodes:[`extract`,`ontsrc`,`gen`,`pub`]},{n:7,title:`Build it`,short:`Build`,c:`var(--ink)`,nodes:null}],sp={1:[{q:`Who writes the ontology?`,o:[`The extraction pipeline`,`People, through reviewed pull requests`,`Neptune, from the data it holds`],a:1,why:`Machines propose; people decide what things mean.`},{q:`What should version 1 start from?`,o:[`Importing all of FIBO`,`One system’s database schema`,`Standards, measured against the teams’ questions`],a:2,why:`Map to ISO 20022 and FIBO, then count how many questions the draft answers.`},{q:`A chargeback arrives with no capture link. What stops it?`,o:[`OWL, because it defines Chargeback`,`SHACL, because the shape requires one Capture`,`Git, because the change wasn’t reviewed`],a:1,why:`OWL would call the capture unknown; SHACL calls it missing and rejects the record.`}],2:[{q:`What is the extraction pipeline’s main job?`,o:[`Fill Neptune and OpenSearch with validated data`,`Write the ontology`,`Answer agents’ questions`],a:0,why:`It follows the ontology; it never writes it.`},{q:`Code shows a dispute state the ontology lacks. What happens?`,o:[`It goes straight into the graph`,`The pipeline opens a pull request for review`,`It is dropped silently`],a:1,why:`Gaps become proposals that a person accepts or rejects.`}],3:[{q:`Which store is the system of record?`,o: `div`,{className:`vrow`,children:[(0,H.jsx)(`span`,{children:e}),(0,H.jsxs)(`div`,{className:`vbars`,children:[(0,H.jsx)(`div`,{className:`vbar t`,children:(0,H.jsx)(`i`,{"data-w":t})}),(0,H.jsx)(`div`,{className:`vbar l`,children:(0,H.jsx)(`i`,{"data-w":n})})]})]},e)),(0,H.jsxs)(`div`,{className:`vnote`,children:[(0,H.jsx)(`b`,{children:`Either way,`}),` we still write a small generator for the Neptune loader files and OpenSearch mappings.`]}),(0,H.jsxs)(`div`,{className:`vrec`,children:[(0,H.jsx)(`b`,{children:`Our suggestion`}),(0,H.jsx)(`span`,{children:`Start in LinkML and publish the generated OWL as the product. If you need OWL axioms LinkML can’t express, keep a small hand-written Turtle file and merge it in CI with robot merge.`})]})]})]})}var Op=`# Illustrative draft of the payments ontology, for the learning page.
#
# It writes down what the page's overview and retrieval walkthrough already show:
# the running examples, the relationship names in their Cypher, the modeling
# patterns from chapter 1 (events not status fields, codes as nodes, one
# direction, a shallow hierarchy, roles), and the classes that chapter's
# competency-question rounds added. Prototype step 1 grows it into the real
# core, bootstrapped from ISO 20022, FIBO and ISO code lists (decision 9):
# each class maps to a standard concept, or says why none fits.
#
# Annotations used on classes, read by the class explorer (web/src/explorer):
#   owner        the team that owns the class (decision 9: layered ownership)
#   lives_in     where instances live: graph (Neptune), warehouse (lake or
#                Snowflake, joining the graph when a question walks through it)
#                or search (text in OpenSearch, a stub in Neptune) - decision 2
#   id_rule      the one ID used in every store (decision 4)
#   example      an instance from the pages' running examples, where one exists
#   no_standard  why a concrete class has no close_mappings
#   search_index which OpenSearch index holds a search class's documents
#
# And on relationships, read by tools/generate.py:
#   edge_properties  properties the edge carries, as name:NeptuneType
#
# Check it with: linkml-lint --config ontology/.linkmllint.yaml ontology/payments.yaml

id: https://ontology.example.com/payments
name: payments
title: Payments ontology (illustrative draft)
version: 1.7.0
prefixes:
  pay: https://ontology.example.com/payments/
  linkml: https://w3id.org/linkml/
  # Standards we align with through skos:closeMatch, never owl:imports (decision 9).
  # Every mapping was checked on 2026-09-30 against the releases pinned below.
  cmns-pts: https://www.omg.org/spec/Commons/PartiesAndSituations/
  cmns-org: https://www.omg.org/spec/Commons/Organizations/
  cmns-doc: https://www.omg.org/spec/Commons/Documents/
  fibo-fnd-aap-ppl: https://spec.edmcouncil.org/fibo/ontology/FND/AgentsAndPeople/People/
  fibo-be-fct-fct: https://spec.edmcouncil.org/fibo/ontology/BE/FunctionalEntities/FunctionalEntities/
  fibo-loan-spc-crd: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CardAccounts/
  fibo-fbc-fct-usjrga: https://spec.edmcouncil.org/fibo/ontology/FBC/FunctionalEntities/NorthAmericanEntities/USRegulatoryAgencies/
  fibo-fbc-fi-stl: https://spec.edmcouncil.org/fibo/ontology/FBC/FinancialInstruments/Settlement/
  # ISO 20022 publishes identifiers for message definitions, not for the events
  # they carry, so a lifecycle event maps to the message that starts it, named by
  # its XML namespace. The version in each name is the pin.
  iso20022: "urn:iso:std:iso:20022:tech:xsd:"
default_prefix: pay
default_range: string
imports:
  - linkml:types
annotations:
  fibo_release: https://spec.edmcouncil.org/fibo/ontology/master/2026Q2/
  commons_release: https://www.omg.org/spec/Commons/20250801/

classes:

  # ---------- Parties and the roles they play ----------

  Party:
    abstract: true
    description: A person or organization that takes part in payments.
    close_mappings: [cmns-pts:Party]
    slots: [id, name, acts_as]
    annotations:
      owner: core
      lives_in: graph

  Person:
    is_a: Party
    description: An individual, such as a cardholder.
    close_mappings: [fibo-fnd-aap-ppl:Person]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "person:{person_id}"
      example: "Maya"

  Organization:
    is_a: Party
    description: >-
      A company or institution. One bank is one Organization, however many
      roles it plays.
    close_mappings: [cmns-org:Organization]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "org:{org_id}"
      example: "First Bay Bank"

  PartyRole:
    abstract: true
    description: >-
      A role a party plays, such as issuer or merchant. Roles keep one bank
      from turning into two nodes.
    close_mappings: [cmns-pts:PartyRole]
    slots: [id]
    annotations:
      owner: core
      lives_in: graph

  Cardholder:
    is_a: PartyRole
    description: The person a card is issued to.
    close_mappings: [fibo-loan-spc-crd:Cardholder]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "ch:{cardholder_id}"
      example: "Maya"

  Issuer:
    is_a: PartyRole
    description: The bank that issues cards and approves or declines their authorizations.
    close_mappings: [fibo-loan-spc-crd:IssuingFinancialInstitution]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "iss:{issuer_id}"
      example: "First Bay Bank"

  Acquirer:
    is_a: PartyRole
    description: The bank that signs up merchants and claims funds for them.
    annotations:
      owner: core
      lives_in: graph
      id_rule: "acq:{acquirer_id}"
      no_standard: >-
        FIBO has no acquirer. ISO 20022 names the acquirer only as a party
        inside card messages, with no identifier of its own.
      example: "Coastal Acquiring"

  Merchant:
    is_a: PartyRole
    description: A business that accepts cards, as its acquirer knows it.
    aliases: [store, merchant outlet]
    close_mappings: [fibo-be-fct-fct:Merchant]
    slots: [name, mcc, acquired_by]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "m:{merchant_id}"
      example: "m:88213, Harbor Grill #4, MCC 5812"

  # ---------- Instruments ----------

  Card:
    description: A payment card, identified by a token rather than its number.
    aliases: [PAN, token]
    close_mappings: [fibo-loan-spc-crd:PaymentCard]
    slots: [id, network, held_by, in_bin_range]
    annotations:
      owner: core
      lives_in: graph
      id_rule: "card:{token}"
      example: "card:tk_1a3"

  BinRange:
    description: >-
      The range of card numbers a bank issues from. A node rather than a
      string, so authorizations can be grouped by it.
    aliases: [BIN, IIN]
    close_mappings: [fibo-fbc-fct-usjrga:IssuerIdentificationNumber]
    slots: [id, prefix, assigned_to]
    annotations:
      owner: authorization
      lives_in: graph
      id_rule: "bin:{prefix}"

  Device:
    description: A phone, browser or terminal an authorization came from.
    slots: [id, seen_at]
    annotations:
      owner: risk
      lives_in: graph
      id_rule: "dev:{device_id}"
      no_standard: >-
        ISO 20022 describes the point of interaction inside card messages,
        with no identifier of its own. FIBO has no device.

  # ---------- Events in a payment's life ----------

  PaymentEvent:
    abstract: true
    description: >-
      Something that happened to a payment, at a time. Each step is its own
      event, instead of a status field that keeps being overwritten.
    slots: [id]
    annotations:
      owner: core
      lives_in: graph

  Authorization:
    is_a: PaymentEvent
    description: The issuer's approval or decline of a payment request.
    aliases: [auth, approval]
    close_mappings: [iso20022:cain.001.001.05]
    slots: [authorized_at, amount, currency, channel, at_merchant, with_card, from_device, has_response]
    slot_usage:
      at_merchant:
        required: true
      with_card:
        required: true
      has_response:
        required: true
    annotations:
      owner: authorization
      lives_in: warehouse
      id_rule: "auth:{authorization_id}"
      example: "auth:5521, Aug 3, $42.50, card not present"

  Capture:
    is_a: PaymentEvent
    description: The merchant claiming the funds an authorization approved.
    aliases: [clearing, presentment]
    close_mappings: [iso20022:cain.003.001.05]
    slots: [captured_at, amount, currency, captures]
    slot_usage:
      captures:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "cap:{capture_id}"
      example: "cap:7731, Aug 4, $42.50"

  Settlement:
    is_a: PaymentEvent
    description: Funds moving between the banks for a batch of captures.
    close_mappings: [fibo-fbc-fi-stl:SettlementEvent]
    slots: [settled_at, settles]
    slot_usage:
      settles:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "stl:{settlement_id}"

  Refund:
    is_a: PaymentEvent
    description: The merchant returning all or part of a captured amount.
    aliases: [credit]
    slots: [refunded_at, amount, currency, refunds]
    slot_usage:
      refunds:
        required: true
    annotations:
      owner: settlement
      lives_in: warehouse
      id_rule: "rf:{refund_id}"
      no_standard: >-
        ISO 20022 sends a refund as a financial message with a refund
        transaction type, so no message stands for refunds alone.

  FraudReport:
    is_a: PaymentEvent
    description: An issuer reporting an authorization as fraud to the network.
    aliases: [TC40, SAFE report]
    close_mappings: [iso20022:cafr.001.001.04]
    slots: [reported_at, reports]
    slot_usage:
      reports:
        required: true
    annotations:
      owner: risk
      lives_in: graph
      id_rule: "fr:{report_id}"

  DisputeEvent:
    is_a: PaymentEvent
    abstract: true
    description: A step in a dispute over a captured transaction.
    slots: [opened_at, disputes, has_reason, responds_to]
    annotations:
      owner: disputes
      lives_in: graph

  Chargeback:
    is_a: DisputeEvent
    title: Chargeback
    aliases: [CB, chargeback case]
    close_mappings: [iso20022:cain.027.001.04]
    description: >-
      A dispute event in which the issuer, through the card network,
      reverses all or part of a captured transaction for the cardholder.
    slot_usage:
      disputes:
        required: true
      has_reason:
        required: true
      opened_at:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "cb:{chargeback_id}"
      example: "cb:1001, Aug 19, reason 10.4"

  Representment:
    is_a: DisputeEvent
    description: The merchant's response to a chargeback, with its evidence.
    aliases: [second presentment, merchant response]
    slots: [has_evidence]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rep:{representment_id}"
      no_standard: >-
        ISO 20022's chargeback response (cain.028) answers a chargeback, but
        whether it carries the merchant's evidence isn't confirmed yet.

  PreArbitration:
    is_a: DisputeEvent
    description: Issuer challenges the merchant's response before arbitration.
    aliases: [pre-arb]
    slot_usage:
      responds_to:
        required: true
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "parb:{pre_arbitration_id}"
      no_standard: >-
        Pre-arbitration is a card network rule, with no ISO 20022 message or
        FIBO concept of its own.

  # ---------- Codes and documents ----------

  ReasonCode:
    description: >-
      A network's reason for a dispute. A node, so chargebacks and the
      documents that explain the code meet at one place.
    aliases: [dispute reason]
    slots: [id, network, code]
    annotations:
      owner: disputes
      lives_in: graph
      id_rule: "rc:{network}:{code}"
      no_standard: >-
        Each card network publishes its own dispute reason codes; no ISO
        list covers them.
      example: "rc:visa:10.4, Other Fraud: Card-Absent Environment"
      code_list: VisaReasonCode

  ResponseCode:
    description: The issuer's answer code on an authorization, such as approved or declined.
    slots: [id, code]
    annotations:
      owner: authorization
      lives_in: graph
      id_rule: "resp:{code}"
      no_standard: >-
        Response codes come from ISO 8583 and each network's rules, which
        publish no identifiers to map to.

  Document:
    description: >-
      A network rule book, runbook or piece of evidence. Its text lives in
      search; Neptune keeps a stub.
    close_mappings: [cmns-doc:Document]
    slots: [id, name, kind]
    annotations:
      owner: core
      lives_in: search
      id_rule: "{doc_slug}"
      example: "visa-vamp-2026"

  Chunk:
    description: >-
      A passage of a document. Its text and embedding live in OpenSearch; the
      stub in Neptune links it to the entities it mentions.
    slots: [id, part_of, mentions]
    annotations:
      owner: core
      lives_in: search
      id_rule: "{doc_slug}#{chunk}"
      search_index: chunks
      no_standard: >-
        A passage of an indexed document is this platform's own idea.
      example: "visa-vamp-2026#c04"

  # ---------- Open ranges ----------

  Any:
    class_uri: linkml:Any
    description: >-
      Any entity with an ID. A relationship whose range is Any can point at a
      node of any class, as a chunk's MENTIONS does. Not a node itself.

slots:

  # ---------- Attributes ----------

  id:
    identifier: true
    description: The one ID used in Neptune, OpenSearch and Snowflake.
  name:
    description: What people call it.
  mcc:
    description: Merchant category code, from ISO 18245.
    pattern: "^\\\\d{4}$"
    close_mappings: [fibo-be-fct-fct:MerchantCategoryCode]
  network:
    description: The card network whose rules apply.
    range: CardNetwork
  code:
    description: The code as the network or issuer writes it.
  prefix:
    description: The leading digits every card in the range shares.
  kind:
    description: What sort of document it is.
    range: DocumentKind
  amount:
    description: The amount, in the transaction currency.
    range: decimal
  currency:
    description: The transaction currency, as an ISO 4217 alphabetic code such as USD.
    pattern: "^[A-Z]{3}$"
  channel:
    description: Whether the card was present.
    range: Channel
  authorized_at:
    description: When the issuer answered.
    range: datetime
  captured_at:
    description: When the merchant claimed the funds.
    range: datetime
  settled_at:
    description: When the funds moved.
    range: datetime
  refunded_at:
    description: When the refund was made.
    range: datetime
  reported_at:
    description: When the fraud was reported.
    range: datetime
  opened_at:
    description: When the dispute step began.
    range: datetime

  # ---------- Relationships: one canonical direction each ----------

  acts_as:
    description: A party plays a role.
    range: PartyRole
    multivalued: true
  acquired_by:
    description: A merchant's acquiring bank.
    range: Acquirer
  held_by:
    description: Who a card is issued to.
    range: Cardholder
  in_bin_range:
    description: The BIN range a card's number falls in.
    range: BinRange
  assigned_to:
    description: The issuer a BIN range belongs to.
    range: Issuer
  at_merchant:
    description: Where an authorization was requested.
    range: Merchant
  with_card:
    description: The card an authorization used.
    range: Card
  from_device:
    description: The device an authorization came from.
    range: Device
  seen_at:
    description: >-
      A summary edge, rebuilt daily from Snowflake: the device made
      authorizations at the merchant. It carries auths, first_seen and
      last_seen, so risk walks don't need every authorization in the graph
      (decision 2).
    range: Merchant
    multivalued: true
    annotations:
      edge_properties: "auths:Long, first_seen:DateTime, last_seen:DateTime"
  has_response:
    description: The issuer's answer to an authorization.
    range: ResponseCode
  captures:
    description: The authorization a capture claims funds for.
    range: Authorization
  settles:
    description: The captures a settlement pays out.
    range: Capture
    multivalued: true
  refunds:
    description: The capture a refund returns money from.
    range: Capture
  disputes:
    description: Links a dispute event to the capture it contests.
    range: Capture
  has_reason:
    description: The network reason codes behind a dispute.
    range: ReasonCode
    multivalued: true
  responds_to:
    description: The earlier dispute event this one answers.
    range: DisputeEvent
  has_evidence:
    description: Documents sent as evidence.
    range: Document
    multivalued: true
  reports:
    description: The authorization a fraud report is about.
    range: Authorization
  part_of:
    description: The document a chunk comes from.
    range: Document
  mentions:
    description: >-
      Anything a chunk names, such as a merchant, a reason code or a dispute,
      so its text links to the graph.
    range: Any
    multivalued: true
